<script type="module">
// pdf.js — extracts real text from each uploaded PDF client-side (same
// pattern as Onboarding's brand-materials upload).
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.worker.min.mjs";

window.extractPdfText = async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n";
  }
  return text;
};
</script>

<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: true, back: "process.html" });
document.getElementById("footer").innerHTML = renderFooter();
document.getElementById("page-nav").innerHTML = renderPageNav("outreach");

const KNOWN_KEY = "a8i_known_creators";
const DECISIONS_KEY = "a8i_creator_decisions";
const TRACKING_KEY = "a8i_tracking_status";
const TOKENS_KEY = "a8i_form_tokens";

function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}"); } catch { return {}; } }
function loadDecisions() { try { return JSON.parse(localStorage.getItem(DECISIONS_KEY) || "{}"); } catch { return {}; } }
function loadTracking() { try { return JSON.parse(localStorage.getItem(TRACKING_KEY) || "{}"); } catch { return {}; } }
function saveTracking(t) { localStorage.setItem(TRACKING_KEY, JSON.stringify(t)); }
function loadTokens() { try { return JSON.parse(localStorage.getItem(TOKENS_KEY) || "{}"); } catch { return {}; } }
function saveTokens(t) { localStorage.setItem(TOKENS_KEY, JSON.stringify(t)); }

// Outreach steps map directly onto the 11 generated messages (msg: the
// number Outreach Copy tags each message with) rather than generic stages,
// so "Email Follow-up #1" here is literally the same message you'd copy.
// Declined sits mid-array on purpose — stageColorClass treats it as a
// negative/closed outcome regardless of position, and Confirmed stays last
// so it reads as the "done" green stage.
const OUTREACH_STEPS = [
  { label: "Not started", msg: null },
  { label: "Initial Email Sent", msg: 1 },
  { label: "Email Follow-up #1", msg: 2 },
  { label: "Initial DM Sent", msg: 3 },
  { label: "DM Follow-up #1", msg: 4 },
  { label: "Follow-up — Form Not Filled", msg: 9 },
  { label: "Declined", msg: 6 },
  { label: "Confirmed", msg: 10 },
];
const OUTREACH_STEP_LABELS = OUTREACH_STEPS.map(s => s.label);
const GIFTING_STAGES = ["Not started", "Order placed", "Shipped", "Delivered"];
const POSTING_STAGES = ["Not started", "Content due", "Posted", "Live"];

function stageColorClass(stages, value, negatives = []) {
  if (negatives.includes(value)) return "stage-muted";
  const idx = stages.indexOf(value);
  if (idx <= 0) return "stage-red";
  if (idx === stages.length - 1) return "stage-green";
  return "stage-amber";
}
function platLink(url, label) {
  return url ? `<a class="plat-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(label)}</a>` : `<span class="dim">—</span>`;
}
function igCell(c) { return c.ig_handle ? platLink(c.ig_url, "@" + c.ig_handle) : `<span class="dim">—</span>`; }
function ttCell(c) { return c.tt_handle ? platLink(c.tt_url, "@" + c.tt_handle) : `<span class="dim">—</span>`; }
function fmtFollowers(n) { return n == null ? "—" : n.toLocaleString(); }
function statusOptions(stages, current) {
  return stages.map(s => `<option value="${escHtml(s)}"${s === current ? " selected" : ""}>${escHtml(s)}</option>`).join("");
}
function fmtUpdated(ts) {
  if (!ts) return `<span class="dim">—</span>`;
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function loadOutreachMessages() { try { return JSON.parse(localStorage.getItem("a8i_outreach_messages") || "{}"); } catch { return {}; } }

const known = loadKnown();
const decisions = loadDecisions();
let tracking = loadTracking();
const content = document.getElementById("content");
const tabs = document.querySelectorAll(".src-tab");
let activeTab = "tracking";

tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    tabs.forEach(b => b.classList.toggle("active", b === btn));
    renderActiveTab();
  });
});

function renderActiveTab() {
  if (activeTab === "tracking") renderTrackingTab();
  else if (activeTab === "formgen") renderFormGenTab();
  else if (activeTab === "inbox") renderInboxTab();
  else renderCopyTab();
}

// ── Initial Outreach / Follow-up #1 batch sending — ported from Caroline's
// Merit seeding system (the real backend A8I is modeled on). Each send is
// simulated (no email provider connected yet) rather than routed through
// Mailmeteor — picking people and hitting Send just marks them sent and
// personalizes their message from Outreach Copy. Eligibility rules and
// undo are the same idea, adapted to A8I's single flat creator list rather
// than Merit's cross-campaign checks.
const FOLLOWUP_DELAY_DAYS = 3; // matches Merit's own default "Follow-up days"
const DAY_MS = 24 * 60 * 60 * 1000;

// Adapted from Merit's rules (has an email, not do-not-contact, not emailed
// elsewhere recently, not already gifted) — the "emailed elsewhere recently"
// cooldown collapses to just "outreach stage unset" here, since A8I tracks
// one flat creator list rather than multiple campaigns a creator could be
// in at once.
function isEligibleInitial(t) {
  if (!t.email) return false;
  if (t.doNotContact) return false;
  if (t.outreach && t.outreach !== "Not started") return false;
  if (t.gifting && t.gifting !== "Not started") return false;
  return true;
}
function isEligibleFollowup(t) {
  if (!t.email) return false;
  if (t.doNotContact) return false;
  if (t.outreach !== "Initial Email Sent") return false;
  if (!t.outreachSentAt) return false;
  if (Date.now() - t.outreachSentAt < FOLLOWUP_DELAY_DAYS * DAY_MS) return false;
  return true;
}

let lastBatch = null; // { kind, ids, prev: {id: {...tracking snapshot before the batch}} }

function openOutreachBatchModal(kind, approvedCreators) {
  const isInitial = kind === "initial";
  const title = isInitial ? "Initial Outreach" : "Follow-up #1";
  const msgNum = isInitial ? 1 : 2;
  const msgTemplate = loadOutreachMessages()[msgNum] || "";
  const verticalOptions = [...new Set(approvedCreators.map(c => c.vertical).filter(Boolean))].sort();
  const genderOptions = [...new Set(approvedCreators.map(c => c.gender).filter(Boolean))].sort();

  // `editedTemplate` is the working copy applied to everyone who hasn't been
  // individually edited — starts as Outreach Copy's generated message, but
  // "Edit copy for all" can rewrite it for this send only (doesn't touch
  // what's saved on the Outreach Copy tab). `overrides` holds anyone whose
  // own message was hand-edited individually; those always win over the
  // bulk template, for that person, until reset.
  let editedTemplate = msgTemplate;
  const overrides = {};
  let editingRowId = null;

  function effectiveMessage(c) {
    return overrides[c.id] != null ? overrides[c.id] : editedTemplate.replace(/\[NAME\]/g, c.name);
  }

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal-card" style="max-width:640px;max-height:85vh;overflow-y:auto">
      <h3>${escHtml(title)}</h3>
      <p>Eligibility: has an email, not Do Not Contact, not already gifted${isInitial ? "" : `, sent the initial email at least ${FOLLOWUP_DELAY_DAYS} days ago`}. Each email below is message #${msgNum} from Outreach Copy, personalized with that creator's name.</p>
      ${!msgTemplate ? `<p style="color:var(--amber);font-size:12.5px;margin-bottom:14px">No Outreach Copy generated yet for message #${msgNum} — generate it on the Outreach Copy tab first, or edit copy for all below before sending.</p>` : ""}
      <div class="field">
        <div class="field-row field-row-3" style="margin-bottom:0">
          <select id="batch-filter-vertical"><option value="">All verticals</option>${verticalOptions.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join("")}</select>
          <select id="batch-filter-gender"><option value="">All genders</option>${genderOptions.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join("")}</select>
          <input type="text" id="batch-filter-location" placeholder="Location contains…">
        </div>
      </div>
      <div class="batch-select-row">
        <span id="batch-eligible-count"></span>
        <button class="btn-link" type="button" id="batch-select-all">Select all</button>
        <button class="btn-link" type="button" id="batch-select-none">Select none</button>
        <button class="btn-link" type="button" id="batch-edit-template">Edit copy for all</button>
      </div>
      <div id="batch-template-editor"></div>
      <div class="batch-list" id="batch-list"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-outline" type="button" id="batch-cancel">Cancel</button>
        <button class="btn btn-solid" type="button" id="batch-confirm">Send <span id="batch-send-count">0</span> Email<span id="batch-send-plural">s</span></button>
      </div>
      <p class="dim" style="font-size:11px;margin-top:10px">No email provider is connected yet — this marks each selected creator as sent and uses their personalized message, but doesn't actually deliver anything.</p>
    </div>
  `;
  document.body.appendChild(overlay);

  let eligible = [];
  let selected = new Set();

  function recompute() {
    const vertical = document.getElementById("batch-filter-vertical").value;
    const gender = document.getElementById("batch-filter-gender").value;
    const loc = document.getElementById("batch-filter-location").value.trim().toLowerCase();
    eligible = approvedCreators.filter(c => {
      const t = tracking[c.id] || {};
      if (!(isInitial ? isEligibleInitial(t) : isEligibleFollowup(t))) return false;
      if (vertical && c.vertical !== vertical) return false;
      if (gender && c.gender !== gender) return false;
      if (loc && !(c.location || "").toLowerCase().includes(loc)) return false;
      return true;
    });
    selected = new Set(eligible.map(c => c.id)); // narrowing the filters defaults back to "everyone shown"
    document.getElementById("batch-eligible-count").textContent = `${eligible.length.toLocaleString()} eligible`;
    renderList();
  }

  function renderTemplateEditor(open) {
    const el = document.getElementById("batch-template-editor");
    if (!open) { el.innerHTML = ""; return; }
    el.innerHTML = `
      <div class="batch-template-editor">
        <label style="font-size:11.5px;font-weight:700;display:block;margin-bottom:6px">Editing message #${msgNum} for everyone below — keep [NAME] wherever each creator's own name should go. Doesn't change what's saved on Outreach Copy, and won't overwrite anyone edited individually.</label>
        <textarea id="batch-template-input" rows="8">${escHtml(editedTemplate)}</textarea>
        <div class="modal-actions" style="margin-top:8px">
          <button class="btn btn-outline" type="button" id="batch-template-cancel">Cancel</button>
          <button class="btn btn-solid" type="button" id="batch-template-save">Save for all</button>
        </div>
      </div>
    `;
    document.getElementById("batch-template-cancel").addEventListener("click", () => renderTemplateEditor(false));
    document.getElementById("batch-template-save").addEventListener("click", () => {
      editedTemplate = document.getElementById("batch-template-input").value;
      renderTemplateEditor(false);
      renderList();
    });
  }
  document.getElementById("batch-edit-template").addEventListener("click", () => renderTemplateEditor(true));

  function renderList() {
    const list = document.getElementById("batch-list");
    list.innerHTML = eligible.length ? eligible.map(c => {
      const editingThis = editingRowId === c.id;
      const effectiveMsg = effectiveMessage(c);
      const preview = effectiveMsg
        ? escHtml(effectiveMsg.slice(0, 90)) + (effectiveMsg.length > 90 ? "…" : "")
        : `<span class="dim">No message generated</span>`;
      return `
        <div class="batch-row" data-id="${escHtml(c.id)}">
          <div class="batch-row-top">
            <label class="batch-row-main">
              <input type="checkbox" class="batch-chk" data-id="${escHtml(c.id)}" ${selected.has(c.id) ? "checked" : ""}>
              <div class="batch-row-body">
                <div class="batch-row-head">
                  <strong>${escHtml(c.name)}</strong>
                  <span class="dim">@${escHtml(c.ig_handle || c.tt_handle || "—")}</span>
                  ${overrides[c.id] != null ? `<span class="batch-edited-tag">Edited</span>` : ""}
                </div>
                <div class="batch-row-preview">${preview}</div>
              </div>
            </label>
            <button class="btn-icon batch-row-edit-btn" type="button" data-id="${escHtml(c.id)}" title="Edit this person's message">&#9998;</button>
          </div>
          ${editingThis ? `
            <div class="batch-row-editor">
              <textarea id="batch-row-input" rows="6">${escHtml(effectiveMsg)}</textarea>
              <div class="modal-actions" style="margin-top:8px">
                <button class="btn btn-outline" type="button" id="batch-row-cancel">Cancel</button>
                ${overrides[c.id] != null ? `<button class="btn btn-outline" type="button" id="batch-row-reset">Reset to template</button>` : ""}
                <button class="btn btn-solid" type="button" id="batch-row-save">Save</button>
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }).join("") : `<p class="dim" style="padding:16px 0">No one matches these filters.</p>`;

    list.querySelectorAll(".batch-chk").forEach(chk => {
      chk.addEventListener("change", () => {
        if (chk.checked) selected.add(chk.dataset.id); else selected.delete(chk.dataset.id);
        updateSendCount();
      });
    });
    list.querySelectorAll(".batch-row-edit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        editingRowId = editingRowId === btn.dataset.id ? null : btn.dataset.id;
        renderList();
      });
    });
    if (editingRowId) {
      const c = eligible.find(x => x.id === editingRowId);
      document.getElementById("batch-row-cancel")?.addEventListener("click", () => { editingRowId = null; renderList(); });
      document.getElementById("batch-row-save")?.addEventListener("click", () => {
        overrides[c.id] = document.getElementById("batch-row-input").value;
        editingRowId = null;
        renderList();
      });
      document.getElementById("batch-row-reset")?.addEventListener("click", () => {
        delete overrides[c.id];
        editingRowId = null;
        renderList();
      });
    }
    updateSendCount();
  }

  function updateSendCount() {
    const n = eligible.filter(c => selected.has(c.id)).length;
    document.getElementById("batch-send-count").textContent = n;
    document.getElementById("batch-send-plural").textContent = n === 1 ? "" : "s";
  }

  ["batch-filter-vertical", "batch-filter-gender", "batch-filter-location"].forEach(id => {
    document.getElementById(id).addEventListener("input", recompute);
  });
  document.getElementById("batch-select-all").addEventListener("click", () => {
    eligible.forEach(c => selected.add(c.id));
    renderList();
  });
  document.getElementById("batch-select-none").addEventListener("click", () => {
    selected.clear();
    renderList();
  });

  recompute();

  function close() { overlay.remove(); }
  document.getElementById("batch-cancel").addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });

  document.getElementById("batch-confirm").addEventListener("click", async () => {
    const batch = eligible.filter(c => selected.has(c.id));
    if (!batch.length) { close(); return; }
    const prev = {};
    const newStage = isInitial ? "Initial Email Sent" : "Email Follow-up #1";
    const tsField = isInitial ? "outreachSentAt" : "followupSentAt";
    batch.forEach(c => {
      prev[c.id] = { ...(tracking[c.id] || {}) };
      tracking[c.id] = { ...(tracking[c.id] || {}), outreach: newStage, [tsField]: Date.now(), updatedAt: Date.now() };
    });
    saveTracking(tracking);
    lastBatch = { kind, ids: batch.map(c => c.id), prev };

    // Creators flagged `testable` (seeded from the Inbox tab's Live Test
    // Connection panel) get an actually-delivered email through the real
    // Gmail backend, proving the full loop end to end — everyone else in
    // the mock dataset stays simulated-only, since their contact info isn't
    // real. Each one uses its effective message — the bulk-edited template,
    // or that person's own individually-edited override. Failures here
    // (backend not running locally) are swallowed — the simulated marking
    // above already happened either way.
    let realSentCount = 0;
    for (const c of batch.filter(c => c.testable)) {
      const to = (tracking[c.id] || {}).email;
      if (!to) continue;
      const body = effectiveMessage(c);
      try {
        await fetch(`${OUTREACH_API}/api/outreach/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ to, body }),
        });
        realSentCount++;
      } catch {}
    }

    close();
    const realNote = realSentCount ? ` (${realSentCount} actually delivered via Gmail — check the Inbox tab)` : "";
    showUndoBanner(`${batch.length} email${batch.length === 1 ? "" : "s"} "sent"${realNote} — marked "${newStage}".`);
    renderTrackingTab();
  });
}

function showUndoBanner(message) {
  document.querySelectorAll(".outreach-undo-banner").forEach(b => b.remove());
  const banner = document.createElement("div");
  banner.className = "outreach-undo-banner";
  banner.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:12px 20px;display:flex;align-items:center;gap:16px;z-index:300;font-size:13px";
  banner.innerHTML = `<span>${escHtml(message)}</span><button type="button" id="outreach-undo-btn" style="color:var(--white);text-decoration:underline;background:none;border:none;cursor:pointer;font:inherit">Undo</button>`;
  document.body.appendChild(banner);
  document.getElementById("outreach-undo-btn").addEventListener("click", () => {
    if (!lastBatch) return;
    lastBatch.ids.forEach(id => { tracking[id] = lastBatch.prev[id]; });
    saveTracking(tracking);
    lastBatch = null;
    banner.remove();
    renderTrackingTab();
  });
  setTimeout(() => banner.remove(), 15000);
}

// ── Tab 1: Tracking (moved here from Sourcing — this is where progress on
// an approved creator actually lives once sourcing is done) ──────────────
function renderTrackingTab() {
  const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");

  if (!approvedCreators.length) {
    content.innerHTML = `
      <div class="empty-state">
        No creators approved yet.<br>
        Head to Sourcing and start voting "Y" — approved creators show up here for status tracking.
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="src-label">Status Tracker</div>
    <p class="review-summary">Outreach, gifting, and posting status for every approved creator — update statuses as a program moves along.</p>
    <div class="src-toolbar">
      <input type="search" id="track-search" placeholder="Search name or handle…">
      <select id="track-filter-client"><option value="">All clients</option></select>
      <button class="btn btn-outline" type="button" id="btn-initial-outreach" style="padding:8px 16px;font-size:11px;margin-left:auto">Initial Outreach</button>
      <button class="btn btn-outline" type="button" id="btn-followup-outreach" style="padding:8px 16px;font-size:11px">Follow-up &#35;1</button>
    </div>
    <p class="src-shown-count" id="shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table track-table">
        <thead>
          <tr>
            <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
            <th class="no-sort">Instagram</th>
            <th class="no-sort">TikTok</th>
            <th class="no-sort">IG Followers</th>
            <th class="no-sort">TT Followers</th>
            <th class="no-sort">Email</th>
            <th class="no-sort">Outreach</th>
            <th class="no-sort">Gifting</th>
            <th class="no-sort">Posting</th>
            <th class="no-sort" style="text-align:center">Do Not Contact</th>
            <th class="no-sort">Updated At</th>
          </tr>
        </thead>
        <tbody id="track-tbody"></tbody>
      </table>
    </div>
  `;

  const clientSel = document.getElementById("track-filter-client");
  [...new Set(approvedCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  document.getElementById("btn-initial-outreach").addEventListener("click", () => openOutreachBatchModal("initial", approvedCreators));
  document.getElementById("btn-followup-outreach").addEventListener("click", () => openOutreachBatchModal("followup", approvedCreators));

  let sortCol = "name", sortDir = "asc";

  function render() {
    const q = document.getElementById("track-search").value.trim().toLowerCase();
    const clientFilter = document.getElementById("track-filter-client").value;

    let rows = approvedCreators.filter(c => {
      if (clientFilter && c.client !== clientFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = (a[sortCol] || "").toString().toLowerCase(), bv = (b[sortCol] || "").toString().toLowerCase();
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()} approved`;

    const outreachMessages = loadOutreachMessages();

    document.getElementById("track-tbody").innerHTML = rows.length ? rows.map(c => {
      const t = tracking[c.id] || {};
      const step = OUTREACH_STEPS.find(s => s.label === t.outreach) || OUTREACH_STEPS[0];
      const hasCopy = step.msg && outreachMessages[step.msg];
      return `
        <tr data-id="${escHtml(c.id)}">
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${igCell(c)}</td>
          <td>${ttCell(c)}</td>
          <td>${fmtFollowers(c.ig_followers)}</td>
          <td>${fmtFollowers(c.tt_followers)}</td>
          <td><input type="email" class="email-input" data-id="${escHtml(c.id)}" value="${escHtml(t.email || "")}" placeholder="creator@email.com" style="width:170px"></td>
          <td>
            <div class="outreach-step-cell">
              <select class="status-select ${stageColorClass(OUTREACH_STEP_LABELS, t.outreach, ["Declined"])}" data-field="outreach">${statusOptions(OUTREACH_STEP_LABELS, t.outreach)}</select>
              <button class="btn-icon track-copy-btn" type="button" data-msg="${step.msg || ""}" ${hasCopy ? "" : "disabled"} title="${hasCopy ? "Copy this message, with the creator's name filled in" : "Generate Outreach Copy first, or this step has no message"}">&#128203;</button>
            </div>
          </td>
          <td><select class="status-select ${stageColorClass(GIFTING_STAGES, t.gifting)}" data-field="gifting">${statusOptions(GIFTING_STAGES, t.gifting)}</select></td>
          <td><select class="status-select ${stageColorClass(POSTING_STAGES, t.posting)}" data-field="posting">${statusOptions(POSTING_STAGES, t.posting)}</select></td>
          <td style="text-align:center"><input type="checkbox" class="dnc-chk" data-id="${escHtml(c.id)}" ${t.doNotContact ? "checked" : ""} title="Do Not Contact — excluded from Initial Outreach and Follow-up batches"></td>
          <td class="updated-cell">${fmtUpdated(t.updatedAt)}</td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="11" class="dim" style="text-align:center;padding:30px">No creators match these filters.</td></tr>`;

    document.querySelectorAll(".track-copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = btn.closest("tr");
        const id = row.dataset.id;
        const c = known[id];
        const msg = outreachMessages[btn.dataset.msg] || "";
        const personalized = msg.replace(/\[NAME\]/g, c.name);
        navigator.clipboard.writeText(personalized).then(() => {
          const original = btn.innerHTML;
          btn.innerHTML = "&#10003;";
          setTimeout(() => { btn.innerHTML = original; }, 1200);
        });
      });
    });

    document.querySelectorAll(".status-select").forEach(sel => {
      sel.addEventListener("change", () => {
        const row = sel.closest("tr");
        const id = row.dataset.id;
        const field = sel.dataset.field;
        tracking[id] = { ...(tracking[id] || {}), [field]: sel.value, updatedAt: Date.now() };
        saveTracking(tracking);
        const stages = field === "outreach" ? OUTREACH_STEP_LABELS : field === "gifting" ? GIFTING_STAGES : POSTING_STAGES;
        const negatives = field === "outreach" ? ["Declined"] : [];
        sel.className = `status-select ${stageColorClass(stages, sel.value, negatives)}`;
        if (field === "outreach") render();
        row.querySelector(".updated-cell").innerHTML = fmtUpdated(tracking[id].updatedAt);
      });
    });

    document.querySelectorAll(".email-input").forEach(inp => {
      inp.addEventListener("change", () => {
        const id = inp.dataset.id;
        tracking[id] = { ...(tracking[id] || {}), email: inp.value.trim() || null, updatedAt: Date.now() };
        saveTracking(tracking);
        inp.closest("tr").querySelector(".updated-cell").innerHTML = fmtUpdated(tracking[id].updatedAt);
      });
    });

    document.querySelectorAll(".dnc-chk").forEach(chk => {
      chk.addEventListener("change", () => {
        const id = chk.dataset.id;
        tracking[id] = { ...(tracking[id] || {}), doNotContact: chk.checked, updatedAt: Date.now() };
        saveTracking(tracking);
        chk.closest("tr").querySelector(".updated-cell").innerHTML = fmtUpdated(tracking[id].updatedAt);
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = "asc"; }
      render();
    });
  });
  ["track-search", "track-filter-client"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();
}

// ── Tab 2: Form Generator — a single-use gift-application link per
// creator, standing in for the real Fillout/Zite forms today. Anyone in
// Outreach can get one; opening it (gift-form.html) shows that creator's
// own form, and submitting it writes straight into Gifting's Gift
// Application tab and burns the link so it can't be reused. ────────────────
function renderFormGenTab() {
  const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");

  if (!approvedCreators.length) {
    content.innerHTML = `
      <div class="empty-state">
        No creators approved yet.<br>
        Head to Sourcing and start voting "Y" — approved creators show up here.
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="src-label">Form Generator</div>
    <p class="review-summary">Generate a single-use gift-application link for anyone below — valid for one submission. Whatever they fill out lands directly in Gifting's Gift Application tab.</p>
    <div class="src-toolbar">
      <input type="search" id="fg-search" placeholder="Search name or handle…">
    </div>
    <p class="src-shown-count" id="fg-shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table formgen-table">
        <thead>
          <tr>
            <th class="no-sort">Name</th>
            <th class="no-sort">Instagram</th>
            <th class="no-sort">TikTok</th>
            <th class="no-sort">Status</th>
            <th class="no-sort">Form Link</th>
            <th class="no-sort"></th>
          </tr>
        </thead>
        <tbody id="fg-tbody"></tbody>
      </table>
    </div>
  `;

  function linkFor(token) {
    return new URL(`gift-form.html?token=${token}`, location.href).href;
  }

  function render() {
    const q = document.getElementById("fg-search").value.trim().toLowerCase();
    const tokens = loadTokens();
    const rows = approvedCreators.filter(c =>
      !q || `${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)
    );

    document.getElementById("fg-shown-count").textContent =
      `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()}`;

    document.getElementById("fg-tbody").innerHTML = rows.length ? rows.map(c => {
      const t = tokens[c.id];
      const status = !t ? "Not generated" : (t.usedAt ? "Submitted" : "Link generated");
      const statusClass = !t ? "stage-red" : (t.usedAt ? "stage-green" : "stage-amber");
      return `
        <tr data-id="${escHtml(c.id)}">
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${igCell(c)}</td>
          <td>${ttCell(c)}</td>
          <td><span class="status-pip ${statusClass}">${status}</span></td>
          <td>${t ? `<code class="fg-link">${escHtml(linkFor(t.token))}</code>` : `<span class="dim">—</span>`}</td>
          <td style="text-align:right;white-space:nowrap">
            ${t ? `
              <button class="btn-icon fg-copy-btn" type="button" data-id="${escHtml(c.id)}" title="Copy link">&#128203;</button>
              <button class="btn-icon fg-regen-btn" type="button" data-id="${escHtml(c.id)}" title="Generate a fresh link (invalidates the old one)">&#8635;</button>
            ` : `
              <button class="btn btn-outline fg-gen-btn" type="button" data-id="${escHtml(c.id)}" style="padding:8px 16px;font-size:11px">Generate Form</button>
            `}
          </td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="6" class="dim" style="text-align:center;padding:30px">No creators match this search.</td></tr>`;

    document.querySelectorAll(".fg-gen-btn, .fg-regen-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const tk = loadTokens();
        tk[id] = {
          token: (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2))),
          createdAt: Date.now(),
          usedAt: null,
        };
        saveTokens(tk);
        render();
      });
    });
    document.querySelectorAll(".fg-copy-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tk = loadTokens()[btn.dataset.id];
        if (!tk) return;
        navigator.clipboard.writeText(linkFor(tk.token)).then(() => {
          const original = btn.innerHTML;
          btn.innerHTML = "&#10003;";
          setTimeout(() => { btn.innerHTML = original; }, 1200);
        });
      });
    });
  }

  document.getElementById("fg-search").addEventListener("input", render);
  render();
}

function renderInboxSections() {
  const wrap = document.getElementById("inbox-sections");
  wrap.innerHTML = INBOX_SECTIONS.map(sec => {
    const rows = inboxRows.filter(r => r.section === sec.key);
    return `
      <div class="inbox-section">
        <div class="inbox-section-head">
          <span class="inbox-section-label">${escHtml(sec.label)}</span>
          <span class="inbox-section-count">${rows.length}</span>
          <span class="dim inbox-section-hint">${escHtml(sec.hint)}</span>
        </div>
        ${rows.length ? `<div class="inbox-rows">${rows.map(r => renderInboxRow(r)).join("")}</div>` : `<p class="dim inbox-empty">Nothing here right now.</p>`}
      </div>
    `;
  }).join("");

  wrap.querySelectorAll(".inbox-row-head").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.closest(".inbox-row").dataset.id;
      inboxOpenId = inboxOpenId === id ? null : id;
      renderInboxSections();
    });
  });

  wrap.querySelectorAll(".inbox-send-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const row = inboxRows.find(r => r.id === id);
      const textarea = wrap.querySelector(`.inbox-reply-input[data-id="${id}"]`);
      const text = textarea.value.trim();
      if (!text) return;
      row.messages.push({ from: "agency", text, at: Date.now() });
      // A real human reply from Needs Human View resolves that conversation —
      // mirrors the design: AI handles the clean cases, a person's own send
      // here is what counts as "handled" for the messy ones.
      if (row.section === "needs_human") row.section = "handled";
      saveInboxMock(inboxRows);
      renderInboxSections();
    });
  });

  // Fake "simulate a reply" control per row still in Needs Outreach / Awaiting
  // Reply / Needs Follow-up — lets you see a creator's reply land and the AI
  // sort it, without needing a real inbox to test against.
  wrap.querySelectorAll(".inbox-sim-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const outcome = btn.dataset.outcome;
      const row = inboxRows.find(r => r.id === id);
      const SIM_REPLIES = {
        agree: { text: "Yes, I'd love this! Just sent over my info.", section: "handled", autoText: "Amazing! Please fill out the form below with your shipping info and we'll get this right out to you: [form link]" },
        decline: { text: "Thanks for thinking of me, but I'll pass this time!", section: "handled", autoText: "No worries at all, thanks for letting us know! We'd love to stay in touch for future opportunities." },
        paid: { text: "Interested, but I only do paid partnerships, what's the budget?", section: "handled", autoText: "Totally understand! This one's gifting-only, but we'd love to have you — feel free to reach out to partnerships@agency-eight.com if a paid collab ever makes sense down the line." },
        messy: { text: "Maybe, depends what else is involved — can you tell me more about the brand first?", section: "needs_human", autoText: null },
      };
      const sim = SIM_REPLIES[outcome];
      row.messages.push({ from: "creator", text: sim.text, at: Date.now() });
      row.section = sim.section;
      if (sim.autoText) row.messages.push({ from: "agency", text: sim.autoText, at: Date.now() + 1000, auto: true });
      saveInboxMock(inboxRows);
      inboxOpenId = id;
      renderInboxSections();
    });
  });
}

function renderInboxRow(row) {
  const isOpen = inboxOpenId === row.id;
  const last = row.messages[row.messages.length - 1];
  const needsSimReply = ["awaiting_reply", "needs_followup"].includes(row.section);
  return `
    <div class="inbox-row ${isOpen ? "open" : ""}" data-id="${escHtml(row.id)}">
      <div class="inbox-row-head">

        <span class="inbox-row-handle dim">${escHtml(row.handle)}</span>
        <span class="inbox-row-snippet dim">${last ? escHtml(last.text.slice(0, 70)) + (last.text.length > 70 ? "…" : "") : "No messages yet"}</span>
        ${needsSimReply ? `
          <span class="inbox-sim-group" onclick="event.stopPropagation()">
            <button class="inbox-sim-btn" type="button" data-id="${escHtml(row.id)}" data-outcome="agree">Simulate: Agree</button>
            <button class="inbox-sim-btn" type="button" data-id="${escHtml(row.id)}" data-outcome="decline">Decline</button>
            <button class="inbox-sim-btn" type="button" data-id="${escHtml(row.id)}" data-outcome="paid">Asks Paid</button>
            <button class="inbox-sim-btn" type="button" data-id="${escHtml(row.id)}" data-outcome="messy">Messy reply</button>
          </span>
        ` : ""}
      </div>
      ${isOpen ? `
        <div class="inbox-thread">
          ${row.messages.length ? row.messages.map(m => `
            <div class="inbox-bubble ${m.from === "agency" ? "agency" : "creator"}">
              <div class="inbox-bubble-text">${escHtml(m.text)}</div>
              <div class="inbox-bubble-meta">${m.auto ? "Auto-sent · " : ""}${fmtInboxTime(m.at)}</div>
            </div>
          `).join("") : `<p class="dim" style="padding:10px 0">No messages yet — this creator hasn't been reached out to.</p>`}
          <div class="inbox-reply-row">
            <textarea class="inbox-reply-input" data-id="${escHtml(row.id)}" placeholder="Type a reply…"></textarea>
            <button class="btn btn-solid inbox-send-btn" type="button" data-id="${escHtml(row.id)}" style="padding:10px 20px;font-size:11px">Send</button>
          </div>
        </div>
      ` : ""}
    </div>
  `;
}

// ── Tab 2: Outreach Copy (ports the standalone outreach-brief-creator tool
// into a8i — same prompt, same direct-to-Anthropic call, your own API key) ─
const ANTHROPIC_KEY_STORAGE = "a8i_anthropic_key";
const ANTHROPIC_API_URL = "https://api.anthropic.com/v1/messages";
const ANTHROPIC_MODEL = "claude-sonnet-4-6";

function getAnthropicKey() { return localStorage.getItem(ANTHROPIC_KEY_STORAGE) || ""; }
function promptForAnthropicKey() {
  return new Promise(resolve => {
    const overlay = document.getElementById("key-overlay");
    const input = document.getElementById("key-input");
    input.value = "";
    overlay.classList.remove("hidden");
    input.focus();
    const cleanup = (val) => { overlay.classList.add("hidden"); resolve(val); };
    document.getElementById("key-save").onclick = () => {
      const val = input.value.trim();
      if (val) localStorage.setItem(ANTHROPIC_KEY_STORAGE, val);
      cleanup(val);
    };
    document.getElementById("key-cancel").onclick = () => cleanup("");
  });
}
async function callAnthropic(systemPrompt, userMessage, apiKey) {
  const res = await fetch(ANTHROPIC_API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: ANTHROPIC_MODEL, max_tokens: 8000, system: systemPrompt, messages: [{ role: "user", content: userMessage }] }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Anthropic request failed (${res.status})`);
  }
  const data = await res.json();
  return data.content[0].text;
}

// Exact same 11-message structure as the standalone outreach-brief-creator
// tool (docs/app.js there) — porting it in, not reinventing it.
const OUTREACH_PROMPT = `You are an expert influencer outreach specialist for Agency Eight, an influencer marketing agency. Your job is to create a complete, professional influencer outreach campaign based on the brand materials provided.

Read the provided materials carefully — they contain everything you need: brand voice, product details, target audience, tone, etc. Use them to generate highly customized, on-brand outreach copy.

Generate exactly 11 messages in the following order. Separate each message with a line containing only "---" and start each with "## N. MESSAGE NAME" on its own line.

THE 11 MESSAGES:

## 1. INITIAL EMAIL OUTREACH
Subject line format: [Gifting Opportunity] [Benefit/Hook] from [BRAND]
- Greeting: "Hi [NAME],"
- 1-2 sentence brand intro (only if the creator may not know the brand)
- 2-3 sentences about the product with key benefits
- "We've been loving your content and would love to gift you [PRODUCT] to experience and share your take with your audience."
- Form link CTA — use the placeholder [INSERT FORM LINK] (this gets swapped for that creator's own single-use link from Form Generator before sending)
- Email signature: Name / Title / Agency Eight / Location

## 2. EMAIL FOLLOW-UP #1 (3 days later)
Subject: Re: [same subject]
Brief friendly follow-up. Include [INSERT FORM LINK]. Email signature.

## 3. INITIAL DM OUTREACH (no form link)
Casual, concise. 2-3 sentences about product. End: "Let me know if you're interested and I can share next steps!"

## 4. DM FOLLOW-UP #1 (3 days after initial DM)
Brief follow-up. Include [INSERT FORM LINK]. Add: "If it's easier, feel free to send me your shipping and email info here."

## 5. IF THEY AGREE
"Amazing! Please fill out the form below..." Include [INSERT FORM LINK].

## 6. IF THEY DECLINE
Gracious, warm. Keep door open for future campaigns.

## 7. IF THEY ASK FOR PAID (NOT OFFERING PAID)
Acknowledge interest. Explain gifting only. Still offer free gift. Include [INSERT FORM LINK].

## 8. IF THEY ASK FOR PAID (ARE OFFERING PAID)
"We'd love to explore that! Feel free to reach out to [TEAM EMAIL] and someone from our team will be in touch."

## 9. FOLLOW-UP #2 — FORM NOT FILLED
"Hey [NAME]! We never got your info. If it's easier we can do a manual order, just send over your full name, address, and email address here and I'll get your order placed. LMK if you have any questions!"

## 10. ORDER CONFIRMED + BRIEF
Email version (with subject: Your [BRAND] [PRODUCT] Is On Its Way) + shorter DM version.
Products are on their way. Reference brand deck link: [INSERT BRAND DECK LINK]. Email signature for email version.

## 11. FOLLOW-UP TO POST
Casual check-in after delivery. Ask how they're liking the product. Ask to tag the brand if they share.

EMAIL SIGNATURE FORMAT:
[Manager Name]
[Manager Title]
Agency Eight
[Location]

Use [PLACEHOLDER] format for any values not found in the provided materials.`;

let copyFiles = [];

// Generated copy used to vanish on every tab switch / reload — nothing
// persisted it. Cached here (brand + parsed blocks) so renderCopyTab can
// redraw the last result immediately instead of starting blank.
const OUTREACH_COPY_CACHE_KEY = "a8i_outreach_copy_cache";
function loadOutreachCopyCache() { try { return JSON.parse(localStorage.getItem(OUTREACH_COPY_CACHE_KEY) || "null"); } catch { return null; } }
function saveOutreachCopyCache(c) { localStorage.setItem(OUTREACH_COPY_CACHE_KEY, JSON.stringify(c)); }

// Fixed section titles from OUTREACH_PROMPT's own message structure — used
// to reconstruct a readable view for copy generated before the cache
// above existed. That older code already saved body text per message
// number to `a8i_outreach_messages`, just never the titles/brand, so a
// generation made before this fix shipped is still recoverable from there.
const OUTREACH_MESSAGE_TITLES = {
  1: "INITIAL EMAIL OUTREACH",
  2: "EMAIL FOLLOW-UP #1",
  3: "INITIAL DM OUTREACH",
  4: "DM FOLLOW-UP #1",
  5: "IF THEY AGREE",
  6: "IF THEY DECLINE",
  7: "IF THEY ASK FOR PAID (NOT OFFERING PAID)",
  8: "IF THEY ASK FOR PAID (ARE OFFERING PAID)",
  9: "FOLLOW-UP #2 — FORM NOT FILLED",
  10: "ORDER CONFIRMED + BRIEF",
  11: "FOLLOW-UP TO POST",
};
function recoverOutreachBlocksFromMessages() {
  let messages;
  try { messages = JSON.parse(localStorage.getItem("a8i_outreach_messages") || "null"); } catch { messages = null; }
  if (!messages) return null;
  const blocks = Object.keys(messages)
    .map(Number)
    .sort((a, b) => a - b)
    .map(num => ({ num: String(num), title: OUTREACH_MESSAGE_TITLES[num] || `MESSAGE ${num}`, body: messages[num] }));
  return blocks.length ? blocks : null;
}

function parseOutreachBlocks(text) {
  const blocks = [];
  text.split(/\n---\n/).forEach(block => {
    const m = block.trim().match(/^##\s*(\d+)\.\s*(.+)\n([\s\S]*)$/);
    if (m) blocks.push({ num: m[1], title: m[2].trim(), body: m[3].trim() });
  });
  return blocks;
}

// Same rich-copy pattern as the standalone Outreach Brief Creator tool this
// was ported from: writes both an HTML version (bold/paragraphs preserved
// when pasted into an email client) and a plain-text fallback.
async function copyRich(html, plain) {
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" }),
      }),
    ]);
  } catch {
    await navigator.clipboard.writeText(plain);
  }
}

function blockBodyParagraphsHtml(body) {
  return body.split(/\n\n+/).map(p =>
    `<p style="margin:0 0 12px 0;font-family:Arial,sans-serif;font-size:14px;line-height:1.6;color:#000">${escHtml(p.trim()).replace(/\n/g, "<br>")}</p>`
  ).join("");
}
function blockToHtml(block) {
  return `<h3 style="font-family:Arial,sans-serif;font-size:15px;font-weight:700;margin:0 0 8px 0;color:#000">${escHtml(block.num)}. ${escHtml(block.title)}</h3>` +
    blockBodyParagraphsHtml(block.body);
}
function blocksToHtml(blocks, brand) {
  const title = brand ? `${brand} — Outreach Copy` : "Outreach Copy";
  let html = `<h1 style="font-family:Arial,sans-serif;font-size:28px;font-weight:700;margin:0 0 8px 0;color:#000">${escHtml(title)}</h1><hr style="border:none;border-top:1px solid #ccc;margin:12px 0 24px 0">`;
  blocks.forEach((b, i) => {
    html += blockToHtml(b);
    if (i < blocks.length - 1) html += `<hr style="border:none;border-top:1px solid #ccc;margin:20px 0">`;
  });
  return html;
}
function blocksToPlainText(blocks) {
  return blocks.map(b => `## ${b.num}. ${b.title}\n\n${b.body}`).join("\n\n---\n\n");
}

// Any "[LIKE THIS]" left in the generated text — [NAME] intentionally
// (personalized per-creator later), or a real [PLACEHOLDER]/[INSERT ...]
// Claude couldn't fill in from the materials — gets visually flagged so
// it's obvious what still needs a human to fill in before sending.
function highlightFillIns(escapedText) {
  return escapedText.replace(/\[([^\]]+)\]/g, '<span class="copy-fillin">[$1]</span>');
}
function blockBodyDisplayHtml(body) {
  return `<p style="white-space:pre-wrap;font-size:14px;line-height:1.6;margin:0">${highlightFillIns(escHtml(body))}</p>`;
}

function renderOutreachOutput(blocks, brand) {
  const output = document.getElementById("cp-output");
  if (!output) return;
  if (!blocks.length) { output.innerHTML = ""; return; }

  output.innerHTML = `
    <div class="copy-toolbar">
      <button class="btn btn-outline" type="button" id="cp-copy-all" style="padding:8px 16px;font-size:11px">Copy All</button>
    </div>
    ${blocks.map((b, i) => `
      <div class="form-block copy-block">
        <div class="copy-block-head">
          <div class="form-block-label" style="margin-bottom:0">${escHtml(b.num)}. ${escHtml(b.title)}</div>
          <button class="btn-icon copy-block-btn" type="button" data-i="${i}" title="Copy this message">&#128203;</button>
        </div>
        ${blockBodyDisplayHtml(b.body)}
      </div>
    `).join("")}
  `;

  document.getElementById("cp-copy-all").addEventListener("click", (e) => {
    copyRich(blocksToHtml(blocks, brand), blocksToPlainText(blocks)).then(() => {
      const btn = e.currentTarget;
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  });
  output.querySelectorAll(".copy-block-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const b = blocks[+btn.dataset.i];
      copyRich(blockToHtml(b), `## ${b.num}. ${b.title}\n\n${b.body}`).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = "&#10003;";
        setTimeout(() => { btn.innerHTML = orig; }, 1200);
      });
    });
  });
}

function defaultNotes() {
  try {
    const saved = JSON.parse(localStorage.getItem("a8i_match_result") || "null");
    const c = saved?.criteria;
    if (!c) return "";
    return [c.product && `Gifting: ${c.product}`, c.description].filter(Boolean).join(". ");
  } catch { return ""; }
}

function renderCopyTab() {
  content.innerHTML = `
    <div class="src-label">Outreach Copy</div>
    <p class="review-summary">Generates the same 11-message outreach sequence as the standalone Outreach Brief Creator, right from a8i.</p>
    <div class="product-shell" style="max-width:none">
      <div class="form-block" style="padding-top:0">
        <div class="field">
          <label>Brand materials <span style="font-weight:400;color:var(--dim)">(optional — decks, guidelines, briefs)</span></label>
          <label class="upload-zone" for="copy-upload">
            <div class="icon">&#8679;</div>
            <div><strong>Click to upload</strong> or drag files here</div>
          </label>
          <input type="file" id="copy-upload" accept="application/pdf" multiple style="display:none">
          <div id="copy-file-list" class="brief-list"></div>
        </div>
        <div class="field-row field-row-3">
          <div class="field"><label>Brand name</label><input type="text" id="cp-brand" placeholder="e.g. ILIA Beauty"></div>
          <div class="field"><label>Brand Instagram</label><input type="text" id="cp-ig" placeholder="e.g. @iliabeauty"></div>
          <div class="field"><label>Brand website</label><input type="text" id="cp-site" placeholder="https://..."></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Team email</label><input type="text" id="cp-team-email" placeholder="partnerships@agency-eight.com"></div>
          <div class="field"><label>Location</label><input type="text" id="cp-location" placeholder="e.g. New York, NY"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Your name</label><input type="text" id="cp-name" placeholder="e.g. Loulou"></div>
          <div class="field"><label>Your title</label><input type="text" id="cp-title" placeholder="e.g. ILIA Account Manager"></div>
        </div>
        <div class="field">
          <label>Additional notes</label>
          <textarea id="cp-notes" placeholder="Anything not covered above…">${escHtml(defaultNotes())}</textarea>
        </div>
      </div>
      <div class="form-cta" style="justify-content:flex-start">
        <button class="btn btn-solid" type="button" id="cp-generate">Generate Outreach Copy</button>
      </div>
      <p class="dim" id="cp-status" style="margin-top:14px"></p>
      <div id="cp-output" style="margin-top:30px"></div>
    </div>
  `;

  copyFiles = [];
  const upload = document.getElementById("copy-upload");
  const fileList = document.getElementById("copy-file-list");
  upload.addEventListener("change", () => {
    [...upload.files].forEach(f => {
      const entry = { name: f.name, file: f, uploading: true };
      copyFiles.push(entry);
      renderFileList();
      window.extractPdfText(f).then(text => { entry.text = text; entry.uploading = false; renderFileList(); })
        .catch(() => { entry.text = ""; entry.uploading = false; entry.error = true; renderFileList(); });
    });
  });
  function renderFileList() {
    fileList.innerHTML = copyFiles.map((e, i) => `
      <div class="brief-item ${e.uploading ? "uploading" : ""}">
        <span class="name">${escHtml(e.name)}${e.uploading ? " — reading…" : e.error ? " — couldn't read" : ""}</span>
        <button class="remove" type="button" data-i="${i}">&times;</button>
      </div>
    `).join("");
    fileList.querySelectorAll(".remove").forEach(btn => btn.addEventListener("click", () => {
      copyFiles.splice(+btn.dataset.i, 1);
      renderFileList();
    }));
  }

  document.getElementById("cp-generate").addEventListener("click", generateOutreachCopy);

  // Restore the last generated copy, if any, instead of leaving this blank
  // every time the tab is re-opened or the page reloads.
  const cached = loadOutreachCopyCache();
  if (cached && cached.blocks && cached.blocks.length) {
    document.getElementById("cp-status").textContent = `Generated for ${cached.brand || "this campaign"}.`;
    renderOutreachOutput(cached.blocks, cached.brand);
  } else {
    // No new-style cache yet, but a generation made before that cache
    // existed may still have its body text sitting in the older
    // a8i_outreach_messages key — offer to rebuild a view from that.
    const recoverable = recoverOutreachBlocksFromMessages();
    if (recoverable) {
      document.getElementById("cp-status").innerHTML =
        `Found a previously generated copy that wasn't cached. <button class="btn-link" type="button" id="cp-recover-btn">Recover it</button>`;
      document.getElementById("cp-recover-btn").addEventListener("click", () => {
        saveOutreachCopyCache({ brand: "", blocks: recoverable });
        document.getElementById("cp-status").textContent = "Generated for this campaign.";
        renderOutreachOutput(recoverable, "");
      });
    }
  }
}

async function generateOutreachCopy() {
  let apiKey = getAnthropicKey();
  if (!apiKey) {
    apiKey = await promptForAnthropicKey();
    if (!apiKey) return;
  }

  const fields = {
    brand: document.getElementById("cp-brand").value.trim(),
    ig: document.getElementById("cp-ig").value.trim(),
    site: document.getElementById("cp-site").value.trim(),
    teamEmail: document.getElementById("cp-team-email").value.trim(),
    managerName: document.getElementById("cp-name").value.trim(),
    managerTitle: document.getElementById("cp-title").value.trim(),
    location: document.getElementById("cp-location").value.trim(),
    notes: document.getElementById("cp-notes").value.trim(),
  };

  const lines = [];
  if (fields.brand) lines.push(`Brand name: ${fields.brand}`);
  if (fields.ig) lines.push(`Brand Instagram: ${fields.ig}`);
  if (fields.site) lines.push(`Brand website: ${fields.site}`);
  if (fields.teamEmail) lines.push(`Team email for paid inquiries: ${fields.teamEmail}`);
  if (fields.managerName) lines.push(`Manager name: ${fields.managerName}`);
  if (fields.managerTitle) lines.push(`Manager title: ${fields.managerTitle}`);
  if (fields.location) lines.push(`Location: ${fields.location}`);
  if (fields.notes) lines.push(`Additional notes: ${fields.notes}`);

  const fileTexts = copyFiles.filter(f => f.text).map(f => `--- ${f.name} ---\n${f.text}`);
  let userMessage = "CAMPAIGN DETAILS:\n" + (lines.length ? lines.join("\n") : "(none provided)");
  if (fileTexts.length) userMessage += "\n\nBRAND MATERIALS:\n" + fileTexts.join("\n\n");

  if (!lines.length && !fileTexts.length) {
    document.getElementById("cp-status").textContent = "Add at least a brand name or upload a brand material first.";
    return;
  }

  const status = document.getElementById("cp-status");
  const output = document.getElementById("cp-output");
  const btn = document.getElementById("cp-generate");
  btn.disabled = true;
  status.textContent = "Generating outreach copy… this takes about 30 seconds.";
  output.innerHTML = "";

  try {
    const text = await callAnthropic(OUTREACH_PROMPT, userMessage, apiKey);
    status.textContent = `Generated for ${fields.brand || "this campaign"}.`;

    const blocks = parseOutreachBlocks(text);

    // Saved by message number (not just rendered) so the Tracking tab's
    // per-creator Copy button can pull the exact text for whatever step
    // a creator is on — [NAME] gets swapped for their real name there.
    const messages = {};
    blocks.forEach(b => { messages[b.num] = b.body; });
    localStorage.setItem("a8i_outreach_messages", JSON.stringify(messages));
    saveOutreachCopyCache({ brand: fields.brand, blocks });

    renderOutreachOutput(blocks, fields.brand);
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}
