<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Placement — A8I</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero" style="padding-bottom:40px">
<div id="header"></div>
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I &middot; 05</div>
    <h1>Order Placement</h1>
  </div>
</section>

<section class="section src-section" style="padding-top:60px">
  <div class="src-label">Orders Queue</div>
  <p class="review-summary" id="op-summary"></p>
  <div id="content"></div>
</section>

<div id="page-nav"></div>
<div id="footer"></div>
<script src="common.js"></script>
<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: true, back: "process.html" });
document.getElementById("footer").innerHTML = renderFooter();
document.getElementById("page-nav").innerHTML = renderPageNav("order-placement");

const KNOWN_KEY = "a8i_known_creators";
const ORDER_KEY = "a8i_order_placements";
const GIFT_KEY = "a8i_gift_applications";

function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}"); } catch { return {}; } }
function loadOrders() { try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "{}"); } catch { return {}; } }
function saveOrders(o) { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }
function loadGiftData() { try { return JSON.parse(localStorage.getItem(GIFT_KEY) || "{}"); } catch { return {}; } }
function saveGiftData(d) { localStorage.setItem(GIFT_KEY, JSON.stringify(d)); }

const ORDER_STAGES = ["Pending", "Ordered"];

function platLink(url, label) {
  return url ? `<a class="plat-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(label)}</a>` : `<span class="dim">—</span>`;
}
function igCell(c) { return c.ig_handle ? platLink(c.ig_url, "@" + c.ig_handle) : `<span class="dim">—</span>`; }
function ttCell(c) { return c.tt_handle ? platLink(c.tt_url, "@" + c.tt_handle) : `<span class="dim">—</span>`; }
function cellOr(v) { return v ? escHtml(v) : `<span class="dim">—</span>`; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—"; }

const known = loadKnown();
const content = document.getElementById("content");

// Rows here come from the "Send to Order Placement" button on each Gifting
// row — this page doesn't source its own creators, it's purely what's been
// pushed over from Gifting once their info (shipping, product) is ready.
let orders = loadOrders();
const orderRows = Object.entries(orders)
  .map(([id, o]) => ({ id, creator: known[id], ...o }))
  .filter(r => r.creator);

if (!orderRows.length) {
  document.getElementById("op-summary").textContent = "";
  content.innerHTML = `
    <div class="empty-state">
      No orders queued yet.<br>
      <a href="gifting.html">Send a gift application over from Gifting first &rarr;</a>
    </div>
  `;
} else {
  document.getElementById("op-summary").textContent =
    `${orderRows.length.toLocaleString()} creator${orderRows.length === 1 ? "" : "s"} sent over from Gifting, ready to place.`;

  content.innerHTML = `
    <div class="src-toolbar">
      <input type="search" id="op-search" placeholder="Search name or handle…">
      <select id="op-filter-status">
        <option value="">All statuses</option>
        ${ORDER_STAGES.map(s => `<option value="${escHtml(s)}">${escHtml(s)}</option>`).join("")}
      </select>
      <button class="btn btn-outline" type="button" id="op-export-csv">Export CSV</button>
    </div>
    <p class="src-shown-count" id="shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table order-table">
        <thead>
          <tr>
            <th class="sort" data-col="sentAt">Sent <span class="sort-icon"></span></th>
            <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
            <th class="no-sort">Instagram</th>
            <th class="no-sort">TikTok</th>
            <th class="no-sort">Shipping Address</th>
            <th class="no-sort">Product</th>
            <th class="no-sort">Notes</th>
            <th class="no-sort">Status</th>
            <th class="no-sort"></th>
          </tr>
        </thead>
        <tbody id="op-tbody"></tbody>
      </table>
    </div>
  `;

  let sortCol = "sentAt", sortDir = "desc";
  let currentRows = [];

  function csvCell(v) {
    const s = (v == null ? "" : String(v));
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  function exportCsv() {
    const header = ["Name", "Instagram", "TikTok", "Shipping Address", "Product", "Notes", "Status", "Sent"];
    const lines = [header.map(csvCell).join(",")];
    currentRows.forEach(r => {
      lines.push([
        r.creator.name,
        r.creator.ig_handle ? "@" + r.creator.ig_handle : "",
        r.creator.tt_handle ? "@" + r.creator.tt_handle : "",
        r.shipping || "",
        r.product || "",
        r.notes || "",
        r.orderStatus || "",
        r.sentAt ? new Date(r.sentAt).toLocaleDateString() : "",
      ].map(csvCell).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `a8i-order-placement-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
  document.getElementById("op-export-csv").addEventListener("click", exportCsv);

  function render() {
    orders = loadOrders();
    const q = document.getElementById("op-search").value.trim().toLowerCase();
    const statusFilter = document.getElementById("op-filter-status").value;

    let rows = orderRows.map(r => ({ ...r, ...orders[r.id] })).filter(r => {
      if (statusFilter && r.orderStatus !== statusFilter) return false;
      if (q && !`${r.creator.name} ${r.creator.ig_handle || ""} ${r.creator.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = sortCol === "name" ? a.creator.name : a[sortCol];
      let bv = sortCol === "name" ? b.creator.name : b[sortCol];
      if (sortCol === "sentAt") { av = av || 0; bv = bv || 0; }
      else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    currentRows = rows;
    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${orderRows.length.toLocaleString()} queued`;

    document.getElementById("op-tbody").innerHTML = rows.length ? rows.map(r => {
      const ordered = r.orderStatus === "Ordered";
      return `
      <tr data-id="${escHtml(r.id)}">
        <td class="dim">${fmtDate(r.sentAt)}</td>
        <td class="name-cell">${escHtml(r.creator.name)}</td>
        <td>${igCell(r.creator)}</td>
        <td>${ttCell(r.creator)}</td>
        <td>${cellOr(r.shipping)}</td>
        <td>${cellOr(r.product)}</td>
        <td>${cellOr(r.notes)}</td>
        <td>${ordered ? `<span style="color:var(--green);font-weight:700">&#10003; Ordered</span>` : `<span class="dim">Not placed</span>`}</td>
        <td>${ordered ? "" : `<button class="btn btn-solid op-place-btn" type="button" data-id="${escHtml(r.id)}" style="padding:8px 16px;font-size:11px">Place Order</button>`}</td>
      </tr>
    `;
    }).join("") : `<tr><td colspan="9" class="dim" style="text-align:center;padding:30px">No orders match these filters.</td></tr>`;

    document.querySelectorAll(".src-table th.sort .sort-icon").forEach(el => el.textContent = "");
    const activeTh = document.querySelector(`.src-table th[data-col="${sortCol}"] .sort-icon`);
    if (activeTh) activeTh.textContent = sortDir === "asc" ? " ↑" : " ↓";

    // Placing an order here is the trigger — flips this row's own status AND
    // writes "Order placed" straight back into the Gifting record so the two
    // pages never have to be reconciled by hand. Same interaction as the
    // paid system's own Gift Application tab: a "Place Order" button, not a
    // status dropdown — once placed there's nothing left to change by hand.
    document.querySelectorAll(".op-place-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        orders[id] = { ...(orders[id] || {}), orderStatus: "Ordered", placedAt: Date.now() };
        saveOrders(orders);

        const giftData = loadGiftData();
        giftData[id] = { ...(giftData[id] || {}), status: "Order placed" };
        saveGiftData(giftData);

        render();
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = col === "sentAt" ? "desc" : "asc"; }
      render();
    });
  });
  ["op-search", "op-filter-status"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();
}
</script>
</body>
</html>
