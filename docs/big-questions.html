<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Questions — a8i</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header"></div>
<section class="hero" style="padding-bottom:40px">
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I</div>
    <h1>Big Questions</h1>
    <p class="sub">Strategic open questions, separate from the step-by-step build — mostly Loulou/Aurielle's to work through.</p>
  </div>
</section>
<section class="section" style="padding-top:60px;max-width:820px">
  <ol id="bq-list" style="list-style:none;counter-reset:bq"></ol>
</section>
<div id="footer"></div>

<style>
.bq-item { counter-increment: bq; padding: 30px 0; border-bottom: 1px solid var(--line); position: relative; padding-left: 60px; }
.bq-item:first-child { padding-top: 0; }
.bq-item::before { content: counter(bq, decimal-leading-zero); position: absolute; left: 0; top: 26px; font-family: var(--accent-serif); font-style: italic; font-size: 24px; color: var(--red); }
.bq-item p { font-size: 18px; line-height: 1.5; margin-bottom: 8px; font-weight: 500; }
.bq-item .sub { font-family: var(--accent-serif); font-style: italic; color: var(--dim); font-size: 15px; }
</style>

<script src="common.js"></script>
<script>
const BIG_QUESTIONS = [
  { q: "Who is our help desk?", sub: "Support team" },
  { q: "With so much being automatic, what if people want human intervention? Do we add a step where a human always has to click it?",
    sub: "Briefs. Custom briefs. No briefs. Customized processes?" },
  { q: "If there are Claude integrations, how do we charge and give access to that?" },
  { q: "How do we let this be not as good as humans?",
    sub: "When do they want to upgrade into full A8? Pricing would be the reason to upgrade — or is there something else?" },
];
document.getElementById("header").innerHTML = renderHeader({ onDark: false, back: "index.html" });
document.getElementById("footer").innerHTML = renderFooter();
document.getElementById("bq-list").innerHTML = BIG_QUESTIONS.map(b => `
  <li class="bq-item">
    <p>${escHtml(b.q)}</p>
    ${b.sub ? `<div class="sub">${escHtml(b.sub)}</div>` : ""}
  </li>
`).join("");
</script>
</body>
</html>
