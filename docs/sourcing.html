<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourcing — a8i</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header"></div>
<section class="hero" style="padding-bottom:40px">
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I &middot; 02</div>
    <h1>Sourcing</h1>
    <p class="sub">Review what matched, approve or pass on each one.</p>
  </div>
</section>

<section class="section" style="padding-top:60px;max-width:860px">
  <div id="content"></div>
</section>

<div id="footer"></div>
<script src="common.js"></script>
<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: false, back: "index.html" });
document.getElementById("footer").innerHTML = renderFooter();

const API_BASE = "https://a8i-dashboard.onrender.com";
const DECISIONS_KEY = "a8i_creator_decisions";

function loadDecisions() {
  try { return JSON.parse(localStorage.getItem(DECISIONS_KEY) || "{}"); } catch { return {}; }
}
function saveDecisions(d) {
  localStorage.setItem(DECISIONS_KEY, JSON.stringify(d));
}
let decisions = loadDecisions();

function fmtFollowers(n) {
  if (n == null) return "—";
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return String(n);
}

function metaLine(c) {
  return [c.vertical, c.location, c.age, c.gender, c.client].filter(Boolean).join(" &middot; ");
}

function creatorRow(c) {
  const nameHtml = c.ig_url
    ? `<a class="c-name" href="${escHtml(c.ig_url)}" target="_blank" rel="noopener">${escHtml(c.name)}</a>`
    : `<span class="c-name">${escHtml(c.name)}</span>`;
  const current = decisions[c.id];
  return `
    <div class="creator-row${current === "no" ? " decided-no" : ""}" data-id="${escHtml(c.id)}">
      <div class="info">
        ${nameHtml}
        <div class="meta">${metaLine(c)}</div>
      </div>
      <div class="right">
        <div class="followers">${fmtFollowers(c.followers)}</div>
        <div class="yn-buttons">
          <button class="yn-btn yes${current === "yes" ? " active" : ""}" type="button" data-vote="yes">Y</button>
          <button class="yn-btn no${current === "no" ? " active" : ""}" type="button" data-vote="no">N</button>
        </div>
      </div>
    </div>
  `;
}

function updateTally(allCreators) {
  let approved = 0, disapproved = 0;
  allCreators.forEach(c => {
    if (decisions[c.id] === "yes") approved++;
    else if (decisions[c.id] === "no") disapproved++;
  });
  const pending = allCreators.length - approved - disapproved;
  document.getElementById("tally").innerHTML =
    `<span class="approved">${approved} approved</span><span class="disapproved">${disapproved} disapproved</span><span class="pending">${pending} pending</span>`;
}

function wireVotes(container, allCreators) {
  container.querySelectorAll(".yn-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const row = btn.closest(".creator-row");
      const id = row.dataset.id;
      const vote = btn.dataset.vote;
      decisions[id] = decisions[id] === vote ? undefined : vote; // click again to clear
      if (decisions[id] === undefined) delete decisions[id];
      saveDecisions(decisions);
      row.querySelectorAll(".yn-btn").forEach(b => b.classList.remove("active"));
      if (decisions[id]) btn.classList.add("active");
      row.classList.toggle("decided-no", decisions[id] === "no");
      updateTally(allCreators);
    });
  });
}

const saved = localStorage.getItem("a8i_match_result");
const content = document.getElementById("content");

if (!saved) {
  content.innerHTML = `
    <div class="empty-state">
      No sourcing criteria yet.<br>
      <a href="onboarding.html">Go describe who you're looking for in Onboarding &rarr;</a>
    </div>
  `;
} else {
  const { criteria, data } = JSON.parse(saved);
  const matched = data.matched_creators || [];
  const partial = data.partial_creators || [];
  const allCreators = [...matched, ...partial];

  content.innerHTML = `
    <p class="review-summary">Based on: <em>"${escHtml(criteria.description || "(no description given)")}"</em> &middot;
      ${data.matched.toLocaleString()} confident match${data.matched === 1 ? "" : "es"}, ${data.partial.toLocaleString()} partial, out of ${data.total.toLocaleString()} test creators.</p>
    <div class="review-tally" id="tally"></div>

    <div class="creator-section-label">Confident Matches (${matched.length} shown)</div>
    <div id="matched-list">${matched.length ? matched.map(creatorRow).join("") : `<p class="meta">None found.</p>`}</div>

    <div class="creator-section-label">Needs Review — missing some data (${partial.length} shown)</div>
    <div id="partial-list">${partial.length ? partial.map(creatorRow).join("") : `<p class="meta">None found.</p>`}</div>
  `;
  updateTally(allCreators);
  wireVotes(document.getElementById("matched-list"), allCreators);
  wireVotes(document.getElementById("partial-list"), allCreators);
}
</script>
</body>
</html>
