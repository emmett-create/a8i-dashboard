<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourcing — A8I</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero" style="padding-bottom:40px">
<div id="header"></div>
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I &middot; 02</div>
    <h1>Sourcing</h1>
    <p class="sub">Review what matched, approve or pass on each one.</p>
  </div>
</section>

<section class="section src-section" style="padding-top:60px">
  <div class="src-tabs" id="src-tabs">
    <button class="src-tab active" data-tab="review" type="button">Review</button>
    <button class="src-tab" data-tab="master" type="button">Master List</button>
    <button class="src-tab" data-tab="tracking" type="button">Tracking</button>
  </div>
  <div id="content"></div>
</section>

<div id="footer"></div>
<script src="common.js"></script>
<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: true, back: "process.html" });
document.getElementById("footer").innerHTML = renderFooter();

const DECISIONS_KEY = "a8i_creator_decisions";
const KNOWN_KEY = "a8i_known_creators";
const TRACKING_KEY = "a8i_tracking_status";

function loadDecisions() { try { return JSON.parse(localStorage.getItem(DECISIONS_KEY) || "{}"); } catch { return {}; } }
function saveDecisions(d) { localStorage.setItem(DECISIONS_KEY, JSON.stringify(d)); }
function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}"); } catch { return {}; } }
function saveKnown(k) { localStorage.setItem(KNOWN_KEY, JSON.stringify(k)); }
function loadTracking() { try { return JSON.parse(localStorage.getItem(TRACKING_KEY) || "{}"); } catch { return {}; } }
function saveTracking(t) { localStorage.setItem(TRACKING_KEY, JSON.stringify(t)); }

let decisions = loadDecisions();
let tracking = loadTracking();

const OUTREACH_STAGES = ["Not started", "Sent", "Responded", "Confirmed", "Declined"];
const GIFTING_STAGES = ["Not started", "Order placed", "Shipped", "Delivered"];
const POSTING_STAGES = ["Not started", "Content due", "Posted", "Live"];

function fmtFollowers(n) {
  if (n == null) return "—";
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return String(n);
}
function platLink(url, label) {
  return url ? `<a class="plat-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(label)}</a>` : `<span class="dim">—</span>`;
}
function demoLine(c) {
  const parts = [c.location, c.age, c.gender].filter(Boolean);
  return parts.length ? escHtml(parts.join(" · ")) : `<span class="dim">—</span>`;
}
function socialCell(c) {
  const ig = c.ig_handle ? platLink(c.ig_url, "@" + c.ig_handle) : "";
  const tt = c.tt_handle ? platLink(c.tt_url, "@" + c.tt_handle) : "";
  if (!ig && !tt) return `<span class="dim">—</span>`;
  return `${ig ? `<div class="social-line"><span class="social-tag">IG</span>${ig}</div>` : ""}${tt ? `<div class="social-line"><span class="social-tag">TT</span>${tt}</div>` : ""}`;
}

// ── Merge whatever matched this session into a durable "ever seen" cache,
// so approvals survive the next onboarding run overwriting the match result.
const saved = localStorage.getItem("a8i_match_result");
let known = loadKnown();
let criteria = null, matchSummary = null;

if (saved) {
  const parsed = JSON.parse(saved);
  criteria = parsed.criteria;
  matchSummary = parsed.data;
  const matched = (parsed.data.matched_creators || []).map(c => ({ ...c, bucket: "matched" }));
  const partial = (parsed.data.partial_creators || []).map(c => ({ ...c, bucket: "partial" }));
  [...matched, ...partial].forEach(c => { known[c.id] = c; });
  saveKnown(known);
}

const content = document.getElementById("content");
const tabs = document.querySelectorAll(".src-tab");
let activeTab = "review";

tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    tabs.forEach(b => b.classList.toggle("active", b === btn));
    renderActiveTab();
  });
});

function renderActiveTab() {
  if (activeTab === "review") renderReviewTab();
  else if (activeTab === "master") renderMasterTab();
  else renderTrackingTab();
}

function tableShell({ toolbar, columns, bodyId, extraClass = "" }) {
  return `
    ${toolbar}
    <p class="src-shown-count" id="shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table ${extraClass}">
        <thead><tr>${columns}</tr></thead>
        <tbody id="${bodyId}"></tbody>
      </table>
    </div>
  `;
}

// ── Tab 1: Review (approve / disapprove what this session matched) ───────
function renderReviewTab() {
  if (!saved) {
    content.innerHTML = `
      <div class="empty-state">
        No sourcing criteria yet.<br>
        <a href="onboarding.html">Go describe who you're looking for in Onboarding &rarr;</a>
      </div>
    `;
    return;
  }

  const matched = (matchSummary.matched_creators || []).map(c => ({ ...c, bucket: "matched" }));
  const partial = (matchSummary.partial_creators || []).map(c => ({ ...c, bucket: "partial" }));
  const allCreators = [...matched, ...partial];

  content.innerHTML = `
    <p class="review-summary">Based on: <em>"${escHtml(criteria.description || "(no description given)")}"</em> &middot;
      ${matchSummary.matched.toLocaleString()} confident match${matchSummary.matched === 1 ? "" : "es"}, ${matchSummary.partial.toLocaleString()} partial, out of ${matchSummary.total.toLocaleString()} test creators.</p>
    <div class="review-tally" id="tally"></div>
    ${tableShell({
      toolbar: `
        <div class="src-toolbar">
          <input type="search" id="src-search" placeholder="Search name or handle…">
          <select id="src-filter-bucket">
            <option value="">All (matched + needs review)</option>
            <option value="matched">Confident Matches</option>
            <option value="partial">Needs Review</option>
          </select>
          <select id="src-filter-client"><option value="">All clients</option></select>
          <select id="src-filter-gender"><option value="">All genders</option></select>
          <select id="src-filter-vote">
            <option value="">All (any vote status)</option>
            <option value="pending">Pending only</option>
            <option value="yes">Approved only</option>
            <option value="no">Disapproved only</option>
          </select>
        </div>
      `,
      columns: `
        <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
        <th class="no-sort">Social</th>
        <th class="sort" data-col="followers">Followers <span class="sort-icon"></span></th>
        <th class="sort" data-col="vertical">Vertical <span class="sort-icon"></span></th>
        <th class="no-sort">Demo</th>
        <th class="sort" data-col="client">Client <span class="sort-icon"></span></th>
        <th class="sort" data-col="bucket">Status <span class="sort-icon"></span></th>
        <th class="no-sort">Approve</th>
      `,
      bodyId: "src-tbody",
    })}
  `;

  const clientSel = document.getElementById("src-filter-client");
  [...new Set(allCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });
  const genderSel = document.getElementById("src-filter-gender");
  [...new Set(allCreators.map(c => c.gender).filter(Boolean))].sort().forEach(v => {
    genderSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  let sortCol = "followers", sortDir = "desc";

  function updateTally() {
    let approved = 0, disapproved = 0;
    allCreators.forEach(c => {
      if (decisions[c.id] === "yes") approved++;
      else if (decisions[c.id] === "no") disapproved++;
    });
    const pending = allCreators.length - approved - disapproved;
    document.getElementById("tally").innerHTML =
      `<span class="approved">${approved} approved</span><span class="disapproved">${disapproved} disapproved</span><span class="pending">${pending} pending</span>`;
  }

  function render() {
    const q = document.getElementById("src-search").value.trim().toLowerCase();
    const bucketFilter = document.getElementById("src-filter-bucket").value;
    const clientFilter = document.getElementById("src-filter-client").value;
    const genderFilter = document.getElementById("src-filter-gender").value;
    const voteFilter = document.getElementById("src-filter-vote").value;

    let rows = allCreators.filter(c => {
      if (bucketFilter && c.bucket !== bucketFilter) return false;
      if (clientFilter && c.client !== clientFilter) return false;
      if (genderFilter && c.gender !== genderFilter) return false;
      const vote = decisions[c.id] || "pending";
      if (voteFilter && vote !== voteFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (sortCol === "followers") { av = av || 0; bv = bv || 0; }
      else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${allCreators.length.toLocaleString()} loaded`;

    document.getElementById("src-tbody").innerHTML = rows.length ? rows.map(c => {
      const vote = decisions[c.id];
      return `
        <tr data-id="${escHtml(c.id)}" class="${vote === "no" ? "decided-no" : ""}">
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${socialCell(c)}</td>
          <td>${fmtFollowers(c.followers)}</td>
          <td>${c.vertical ? escHtml(c.vertical) : `<span class="dim">—</span>`}</td>
          <td>${demoLine(c)}</td>
          <td>${escHtml(c.client)}</td>
          <td>${c.bucket === "matched" ? "Match" : "Needs review"}</td>
          <td>
            <div class="yn-cell">
              <button class="yn-btn yes${vote === "yes" ? " active" : ""}" type="button" data-vote="yes">Y</button>
              <button class="yn-btn no${vote === "no" ? " active" : ""}" type="button" data-vote="no">N</button>
            </div>
          </td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="8" class="dim" style="text-align:center;padding:30px">No creators match these filters.</td></tr>`;

    document.querySelectorAll(".src-table th.sort .sort-icon").forEach(el => el.textContent = "");
    const activeTh = document.querySelector(`.src-table th[data-col="${sortCol}"] .sort-icon`);
    if (activeTh) activeTh.textContent = sortDir === "asc" ? " ↑" : " ↓";

    document.querySelectorAll(".yn-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = btn.closest("tr");
        const id = row.dataset.id;
        const vote = btn.dataset.vote;
        if (decisions[id] === vote) delete decisions[id]; else decisions[id] = vote;
        saveDecisions(decisions);
        updateTally();
        render();
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = col === "followers" ? "desc" : "asc"; }
      render();
    });
  });
  ["src-search", "src-filter-bucket", "src-filter-client", "src-filter-gender", "src-filter-vote"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  updateTally();
  render();
}

// ── Tab 2: Master List (every creator ever approved, across sessions) ────
function renderMasterTab() {
  const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");

  if (!approvedCreators.length) {
    content.innerHTML = `
      <div class="empty-state">
        No creators approved yet.<br>
        Head to the Review tab and start voting "Y" on creators to build your master list.
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <p class="review-summary">${approvedCreators.length.toLocaleString()} creator${approvedCreators.length === 1 ? "" : "s"} approved so far, across every onboarding run.</p>
    ${tableShell({
      toolbar: `
        <div class="src-toolbar">
          <input type="search" id="master-search" placeholder="Search name or handle…">
          <select id="master-filter-client"><option value="">All clients</option></select>
          <select id="master-filter-gender"><option value="">All genders</option></select>
        </div>
      `,
      columns: `
        <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
        <th class="no-sort">Social</th>
        <th class="sort" data-col="followers">Followers <span class="sort-icon"></span></th>
        <th class="sort" data-col="vertical">Vertical <span class="sort-icon"></span></th>
        <th class="no-sort">Demo</th>
        <th class="sort" data-col="client">Client <span class="sort-icon"></span></th>
        <th class="no-sort">Remove</th>
      `,
      bodyId: "master-tbody",
    })}
  `;

  const clientSel = document.getElementById("master-filter-client");
  [...new Set(approvedCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });
  const genderSel = document.getElementById("master-filter-gender");
  [...new Set(approvedCreators.map(c => c.gender).filter(Boolean))].sort().forEach(v => {
    genderSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  let sortCol = "followers", sortDir = "desc";

  function render() {
    const q = document.getElementById("master-search").value.trim().toLowerCase();
    const clientFilter = document.getElementById("master-filter-client").value;
    const genderFilter = document.getElementById("master-filter-gender").value;

    let rows = approvedCreators.filter(c => {
      if (clientFilter && c.client !== clientFilter) return false;
      if (genderFilter && c.gender !== genderFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (sortCol === "followers") { av = av || 0; bv = bv || 0; }
      else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()} approved`;

    document.getElementById("master-tbody").innerHTML = rows.length ? rows.map(c => `
      <tr data-id="${escHtml(c.id)}">
        <td class="name-cell">${escHtml(c.name)}</td>
        <td>${socialCell(c)}</td>
        <td>${fmtFollowers(c.followers)}</td>
        <td>${c.vertical ? escHtml(c.vertical) : `<span class="dim">—</span>`}</td>
        <td>${demoLine(c)}</td>
        <td>${escHtml(c.client)}</td>
        <td><button class="remove-btn" type="button">Remove</button></td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="dim" style="text-align:center;padding:30px">No creators match these filters.</td></tr>`;

    document.querySelectorAll(".src-table th.sort .sort-icon").forEach(el => el.textContent = "");
    const activeTh = document.querySelector(`.src-table th[data-col="${sortCol}"] .sort-icon`);
    if (activeTh) activeTh.textContent = sortDir === "asc" ? " ↑" : " ↓";

    document.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.closest("tr").dataset.id;
        decisions[id] = "no";
        saveDecisions(decisions);
        renderMasterTab();
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = col === "followers" ? "desc" : "asc"; }
      render();
    });
  });
  ["master-search", "master-filter-client", "master-filter-gender"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();
}

// ── Tab 3: Tracking (outreach / gifting / posting status per approved creator,
// mirrors the Status columns on the real Google Sheets master lists) ──────
function statusOptions(stages, current) {
  return stages.map(s => `<option value="${escHtml(s)}"${s === current ? " selected" : ""}>${escHtml(s)}</option>`).join("");
}
function fmtUpdated(ts) {
  if (!ts) return `<span class="dim">—</span>`;
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function renderTrackingTab() {
  const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");

  if (!approvedCreators.length) {
    content.innerHTML = `
      <div class="empty-state">
        No creators approved yet.<br>
        Head to the Review tab and start voting "Y" — approved creators show up here for status tracking.
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <p class="review-summary">Outreach, gifting, and posting status for every approved creator — update statuses as a program moves along.</p>
    ${tableShell({
      toolbar: `
        <div class="src-toolbar">
          <input type="search" id="track-search" placeholder="Search name or handle…">
          <select id="track-filter-client"><option value="">All clients</option></select>
        </div>
      `,
      columns: `
        <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
        <th class="no-sort">Social</th>
        <th class="sort" data-col="client">Client <span class="sort-icon"></span></th>
        <th class="no-sort">Outreach</th>
        <th class="no-sort">Gifting</th>
        <th class="no-sort">Posting</th>
        <th class="no-sort">Updated</th>
      `,
      bodyId: "track-tbody",
      extraClass: "track-table",
    })}
  `;

  const clientSel = document.getElementById("track-filter-client");
  [...new Set(approvedCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  let sortCol = "name", sortDir = "asc";

  function render() {
    const q = document.getElementById("track-search").value.trim().toLowerCase();
    const clientFilter = document.getElementById("track-filter-client").value;

    let rows = approvedCreators.filter(c => {
      if (clientFilter && c.client !== clientFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = (a[sortCol] || "").toString().toLowerCase(), bv = (b[sortCol] || "").toString().toLowerCase();
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()} approved`;

    document.getElementById("track-tbody").innerHTML = rows.length ? rows.map(c => {
      const t = tracking[c.id] || {};
      return `
        <tr data-id="${escHtml(c.id)}">
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${socialCell(c)}</td>
          <td>${escHtml(c.client)}</td>
          <td><select class="status-select" data-field="outreach">${statusOptions(OUTREACH_STAGES, t.outreach)}</select></td>
          <td><select class="status-select" data-field="gifting">${statusOptions(GIFTING_STAGES, t.gifting)}</select></td>
          <td><select class="status-select" data-field="posting">${statusOptions(POSTING_STAGES, t.posting)}</select></td>
          <td class="updated-cell">${fmtUpdated(t.updatedAt)}</td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="7" class="dim" style="text-align:center;padding:30px">No creators match these filters.</td></tr>`;

    document.querySelectorAll(".status-select").forEach(sel => {
      sel.addEventListener("change", () => {
        const row = sel.closest("tr");
        const id = row.dataset.id;
        const field = sel.dataset.field;
        tracking[id] = { ...(tracking[id] || {}), [field]: sel.value, updatedAt: Date.now() };
        saveTracking(tracking);
        row.querySelector(".updated-cell").innerHTML = fmtUpdated(tracking[id].updatedAt);
      });
    });
  }

  ["track-search", "track-filter-client"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();
}

renderActiveTab();
</script>
</body>
</html>
