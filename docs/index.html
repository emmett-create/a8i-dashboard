<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A8I — Agency Eight</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash">
  <a class="splash-site-link" href="https://agency-eight.com" target="_blank" rel="noopener">Agency Eight &#8599;</a>
  <div class="splash-eyebrow">Agency Eight</div>
  <h1 class="splash-title">A8I</h1>
  <p class="splash-sub">A lighter, self-serve version of Agency Eight.</p>
  <button class="splash-enter" id="enter-btn" type="button">Enter</button>
</div>
<script>
document.getElementById("enter-btn").addEventListener("click", () => {
  const splash = document.getElementById("splash");
  splash.classList.add("fade-out");
  setTimeout(() => { window.location.href = "process.html"; }, 480);
});
</script>
</body>
</html>
