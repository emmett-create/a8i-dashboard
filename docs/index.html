<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a8i — Our Process</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header"></div>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Agency Eight</div>
    <h1>A8I</h1>
    <p class="sub">A lighter, self-serve version of Agency Eight — gifting results without the full-service lift.</p>
    <div class="tagline">Rough visual skeleton &middot; working draft</div>
  </div>
</section>

<div class="asterisk-divider">* * *</div>

<section class="section">
  <div class="section-head">
    <h2>The Process</h2>
    <p class="sub">Seven areas, mapped out in the 2026-10-20 working session.</p>
  </div>
  <div class="card-grid" id="card-grid"></div>
</section>

<div class="cta-wrap">
  <div class="cta-card">
    <div class="star">&#10022;</div>
    <div class="eyebrow">Open questions</div>
    <h2>The strategy isn't settled yet</h2>
    <div class="btns">
      <a class="btn btn-solid" href="big-questions.html">Big Questions &rarr;</a>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="common.js"></script>
<script>
const AREAS = [
  { id: "onboarding",       num: 1, title: "Onboarding",      desc: "Briefing, intake, and asset-building before anything else starts." },
  { id: "sourcing",         num: 2, title: "Sourcing",        desc: "Database, vetting, AI overviews — plus a master-list-style view of creator progress." },
  { id: "gifting",          num: 3, title: "Gifting",         desc: "The gift application itself, plus cleaning up matches, dupes, and regifts." },
  { id: "outreach",         num: 4, title: "Outreach",        desc: "Our own send tool — not paying Instantly or Mailmeteor indefinitely." },
  { id: "order-placement",  num: 5, title: "Order Placement", desc: "Shopify (or CSV) orders, then the brief goes out automatically." },
  { id: "content-tracking", num: 6, title: "Content Tracking",desc: "Our own Archive, a referral, or a hybrid — still mostly a business question." },
  { id: "reporting",        num: 7, title: "Reporting",       desc: "A dashboard, like Magna." },
];

document.getElementById("header").innerHTML = renderHeader({ onDark: false });
document.getElementById("footer").innerHTML = renderFooter();
const lastAlone = AREAS.length % 3 === 1;
document.getElementById("card-grid").innerHTML = AREAS.map((a, i) => `
  <a class="area-card${(lastAlone && i === AREAS.length - 1) ? " span-full" : ""}" href="${a.id}.html">
    <span class="card-num">${String(a.num).padStart(2,"0")}</span>
    <h3>${escHtml(a.title)}</h3>
    <p>${escHtml(a.desc)}</p>
    <span class="arrow">&rarr;</span>
  </a>
`).join("");
</script>
</body>
</html>
