<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gifting — A8I</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero" style="padding-bottom:40px">
<div id="header"></div>
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I &middot; 04</div>
    <h1>Gifting</h1>
  </div>
</section>

<section class="section src-section" style="padding-top:60px">
  <div class="src-tabs" id="gift-tabs">
    <button class="src-tab active" data-tab="applications" type="button">Gift Application</button>
    <button class="src-tab" data-tab="bundles" type="button">Bundles <span class="mock-flag">Mockup</span></button>
  </div>
  <div id="tab-body"></div>
</section>

<div class="overlay hidden" id="ga-edit-overlay">
  <div class="modal-card">
    <h3>Edit gift application</h3>
    <p id="ga-edit-sub"></p>
    <div class="field"><label>Email</label><input type="text" id="ga-ef-email" placeholder="creator@email.com"></div>
    <div class="field"><label>Phone</label><input type="text" id="ga-ef-phone" placeholder="(555) 555-5555"></div>
    <div class="field"><label>Shipping address</label><input type="text" id="ga-ef-shipping" placeholder="123 Main St, City, ST 00000"></div>
    <div class="field"><label>Product</label><input type="text" id="ga-ef-product" placeholder="e.g. Hero bundle"></div>
    <div class="field"><label>Notes</label><textarea id="ga-ef-notes" placeholder="Anything worth flagging…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" type="button" id="ga-edit-cancel">Cancel</button>
      <button class="btn btn-solid" type="button" id="ga-edit-save">Save</button>
    </div>
  </div>
</div>

<div id="page-nav"></div>
<div id="footer"></div>
<script src="common.js"></script>
<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: true, back: "process.html" });
document.getElementById("footer").innerHTML = renderFooter();
document.getElementById("page-nav").innerHTML = renderPageNav("gifting");

const KNOWN_KEY = "a8i_known_creators";
const DECISIONS_KEY = "a8i_creator_decisions";
const GIFT_KEY = "a8i_gift_applications";

function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}"); } catch { return {}; } }
function loadDecisions() { try { return JSON.parse(localStorage.getItem(DECISIONS_KEY) || "{}"); } catch { return {}; } }
function loadGiftData() { try { return JSON.parse(localStorage.getItem(GIFT_KEY) || "{}"); } catch { return {}; } }
function saveGiftData(d) { localStorage.setItem(GIFT_KEY, JSON.stringify(d)); }

const STATUS_OPTIONS = ["Not placed", "Order placed", "Delivered"];
const ORDER_KEY = "a8i_order_placements";
function loadOrders() { try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "{}"); } catch { return {}; } }
function saveOrders(o) { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }

// First stage red, last stage green, everything between amber; a stage
// flagged as a negative/closed outcome is muted gray instead.
function stageColorClass(stages, value, negatives = []) {
  if (negatives.includes(value)) return "stage-muted";
  const idx = stages.indexOf(value);
  if (idx <= 0) return "stage-red";
  if (idx === stages.length - 1) return "stage-green";
  return "stage-amber";
}

function platLink(url, label, isDup) {
  if (!url) return `<span class="dim">—</span>`;
  const link = `<a class="plat-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(label)}</a>`;
  return isDup ? `<span class="handle-dup" title="Same handle appears more than once in this list">${link}</span>` : link;
}
function igCell(c, isDup) { return c.ig_handle ? platLink(c.ig_url, "@" + c.ig_handle, isDup) : `<span class="dim">—</span>`; }
function ttCell(c, isDup) { return c.tt_handle ? platLink(c.tt_url, "@" + c.tt_handle, isDup) : `<span class="dim">—</span>`; }
function cellOr(v) { return v ? escHtml(v) : `<span class="dim">—</span>`; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—"; }

const tabs = document.querySelectorAll(".src-tab");
let activeTab = "applications";
tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    tabs.forEach(b => b.classList.toggle("active", b === btn));
    renderActiveTab();
  });
});
function renderActiveTab() {
  if (activeTab === "bundles") renderBundlesTab();
  else renderGiftAppTab();
}

function renderGiftAppTab() {
document.getElementById("tab-body").innerHTML = `<p class="review-summary" id="ga-summary"></p><div id="content"></div>`;
const known = loadKnown();
const decisions = loadDecisions();
let giftData = loadGiftData();
const content = document.getElementById("content");

// Approved creators from Sourcing are the applicant pool — standing in for
// a real external intake form (what the paid system calls submissions),
// since a8i doesn't have one of its own yet. Each gets seeded with an empty
// editable application the first time it's seen here, backdated a few mock
// days so the list doesn't look like everything "applied" in the same instant.
// Product defaults to whatever was entered on Onboarding, if anything was.
let defaultProduct = "";
try {
  const saved = JSON.parse(localStorage.getItem("a8i_match_result") || "null");
  defaultProduct = saved?.criteria?.product || "";
} catch {}

const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");
let seeded = false;
approvedCreators.forEach((c, i) => {
  if (!giftData[c.id]) {
    giftData[c.id] = {
      email: "", phone: "", shipping: "", product: defaultProduct, notes: "",
      status: "Not placed",
      submittedAt: Date.now() - ((i % 6) + 1) * 86400000,
    };
    seeded = true;
  }
});
if (seeded) saveGiftData(giftData);

if (!approvedCreators.length) {
  document.getElementById("ga-summary").textContent = "";
  content.innerHTML = `
    <div class="empty-state">
      No gift applications yet.<br>
      <a href="sourcing.html">Approve some creators in Sourcing first &rarr;</a>
    </div>
  `;
} else {
  document.getElementById("ga-summary").textContent =
    `${approvedCreators.length.toLocaleString()} approved creator${approvedCreators.length === 1 ? "" : "s"} from Sourcing, standing in for real gift-application submissions.`;

  content.innerHTML = `
    <div class="src-toolbar">
      <input type="search" id="ga-search" placeholder="Search name or handle…">
      <select id="ga-filter-client"><option value="">All clients</option></select>
      <select id="ga-filter-status">
        <option value="">All statuses</option>
        ${STATUS_OPTIONS.map(s => `<option value="${escHtml(s)}">${escHtml(s)}</option>`).join("")}
      </select>
      <select id="ga-filter-product"><option value="">All products</option></select>
    </div>
    <p class="src-shown-count" id="shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table gift-table">
        <thead>
          <tr>
            <th class="no-sort"></th>
            <th class="sort" data-col="submittedAt">Date <span class="sort-icon"></span></th>
            <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
            <th class="no-sort">Instagram</th>
            <th class="no-sort">TikTok</th>
            <th class="no-sort">Email</th>
            <th class="no-sort">Phone</th>
            <th class="no-sort">Shipping Address</th>
            <th class="no-sort">Product</th>
            <th class="no-sort">Status</th>
            <th class="no-sort">Send to Place?</th>
          </tr>
        </thead>
        <tbody id="ga-tbody"></tbody>
      </table>
    </div>
  `;

  const clientSel = document.getElementById("ga-filter-client");
  [...new Set(approvedCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });
  const productSel = document.getElementById("ga-filter-product");
  [...new Set(approvedCreators.map(c => (giftData[c.id] || {}).product).filter(Boolean))].sort().forEach(v => {
    productSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  let sortCol = "submittedAt", sortDir = "desc";

  function render() {
    const q = document.getElementById("ga-search").value.trim().toLowerCase();
    const clientFilter = document.getElementById("ga-filter-client").value;
    const statusFilter = document.getElementById("ga-filter-status").value;
    const productFilter = document.getElementById("ga-filter-product").value;

    let rows = approvedCreators.filter(c => {
      const g = giftData[c.id] || {};
      if (clientFilter && c.client !== clientFilter) return false;
      if (statusFilter && g.status !== statusFilter) return false;
      if (productFilter && g.product !== productFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      const ga = giftData[a.id] || {}, gb = giftData[b.id] || {};
      let av = sortCol === "submittedAt" ? ga.submittedAt : a[sortCol];
      let bv = sortCol === "submittedAt" ? gb.submittedAt : b[sortCol];
      if (sortCol === "submittedAt") { av = av || 0; bv = bv || 0; }
      else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()} applications`;

    const orders = loadOrders();

    // Gift app cleanup: flag a handle that appears more than once across
    // every approved application — not just the filtered view, since a dupe
    // elsewhere in the list is still worth knowing about.
    const igCounts = {}, ttCounts = {};
    approvedCreators.forEach(c => {
      const ig = (c.ig_handle || "").trim().toLowerCase();
      const tt = (c.tt_handle || "").trim().toLowerCase();
      if (ig) igCounts[ig] = (igCounts[ig] || 0) + 1;
      if (tt) ttCounts[tt] = (ttCounts[tt] || 0) + 1;
    });

    document.getElementById("ga-tbody").innerHTML = rows.length ? rows.map(c => {
      const g = giftData[c.id] || {};
      const alreadySent = !!orders[c.id];
      const igDup = c.ig_handle && igCounts[c.ig_handle.trim().toLowerCase()] > 1;
      const ttDup = c.tt_handle && ttCounts[c.tt_handle.trim().toLowerCase()] > 1;
      return `
        <tr data-id="${escHtml(c.id)}">
          <td><button class="btn-icon ga-edit-btn" type="button" title="Edit email, shipping, product, notes">&#9998;</button></td>
          <td class="dim">${fmtDate(g.submittedAt)}</td>
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${igCell(c, igDup)}</td>
          <td>${ttCell(c, ttDup)}</td>
          <td>${cellOr(g.email)}</td>
          <td>${cellOr(g.phone)}</td>
          <td>${cellOr(g.shipping)}</td>
          <td>${cellOr(g.product)}</td>
          <td><select class="status-select ga-status-sel ${stageColorClass(STATUS_OPTIONS, g.status)}" data-id="${escHtml(c.id)}">${STATUS_OPTIONS.map(s => `<option value="${escHtml(s)}"${s === g.status ? " selected" : ""}>${escHtml(s)}</option>`).join("")}</select></td>
          <td><button class="btn-icon ga-send-order-btn" type="button" data-id="${escHtml(c.id)}" title="${alreadySent ? "Already sent — click to resend the latest details" : "Send to Order Placement"}">${alreadySent ? "&#10003;" : "&rarr;"}</button></td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="11" class="dim" style="text-align:center;padding:30px">No applications match these filters.</td></tr>`;

    document.querySelectorAll(".src-table th.sort .sort-icon").forEach(el => el.textContent = "");
    const activeTh = document.querySelector(`.src-table th[data-col="${sortCol}"] .sort-icon`);
    if (activeTh) activeTh.textContent = sortDir === "asc" ? " ↑" : " ↓";

    document.querySelectorAll(".ga-edit-btn").forEach(btn => {
      btn.addEventListener("click", () => openEditModal(btn.closest("tr").dataset.id));
    });
    document.querySelectorAll(".ga-status-sel").forEach(sel => {
      sel.addEventListener("change", () => {
        giftData[sel.dataset.id] = { ...(giftData[sel.dataset.id] || {}), status: sel.value };
        saveGiftData(giftData);
        sel.className = `status-select ga-status-sel ${stageColorClass(STATUS_OPTIONS, sel.value)}`;
      });
    });
    document.querySelectorAll(".ga-send-order-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const c = known[id];
        const g = giftData[id] || {};
        const ord = loadOrders();
        ord[id] = {
          ...(ord[id] || {}),
          email: g.email, phone: g.phone, shipping: g.shipping, product: g.product, notes: g.notes,
          orderStatus: ord[id]?.orderStatus || "Pending",
          sentAt: Date.now(),
        };
        saveOrders(ord);
        render();
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = col === "submittedAt" ? "desc" : "asc"; }
      render();
    });
  });
  ["ga-search", "ga-filter-client", "ga-filter-status", "ga-filter-product"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();

  // ── Edit modal ───────────────────────────────────────────────────────
  const overlay = document.getElementById("ga-edit-overlay");
  let editingId = null;
  function openEditModal(id) {
    const c = known[id];
    const g = giftData[id] || {};
    editingId = id;
    document.getElementById("ga-edit-sub").textContent = `${c.name} — @${c.ig_handle || c.tt_handle || "no handle"}`;
    document.getElementById("ga-ef-email").value = g.email || "";
    document.getElementById("ga-ef-phone").value = g.phone || "";
    document.getElementById("ga-ef-shipping").value = g.shipping || "";
    document.getElementById("ga-ef-product").value = g.product || "";
    document.getElementById("ga-ef-notes").value = g.notes || "";
    overlay.classList.remove("hidden");
  }
  document.getElementById("ga-edit-cancel").addEventListener("click", () => overlay.classList.add("hidden"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.add("hidden"); });
  document.getElementById("ga-edit-save").addEventListener("click", () => {
    giftData[editingId] = {
      ...(giftData[editingId] || {}),
      email: document.getElementById("ga-ef-email").value.trim(),
      phone: document.getElementById("ga-ef-phone").value.trim(),
      shipping: document.getElementById("ga-ef-shipping").value.trim(),
      product: document.getElementById("ga-ef-product").value.trim(),
      notes: document.getElementById("ga-ef-notes").value.trim(),
    };
    saveGiftData(giftData);
    overlay.classList.add("hidden");
    render();
  });
}
} // end renderGiftAppTab

// ── Bundles (MOCKUP) ─────────────────────────────────────────────────────
// Lets someone define, per campaign, which Shopify products make up a
// gifting bundle and which of those get offered to the creator as a choice
// (a shade/size/scent) vs. sent as-is. The product search below stands in
// for a real call to Shopify's productVariants API (query: title/sku/vendor
// filters, returns real variant id + sku) — no real Shopify store is
// connected yet, so this is a small fake catalog instead, built to test the
// actual screen/interaction before wiring in the real search.
const BUNDLES_KEY = "a8i_bundles_mock";
const MOCK_CATALOG = [
  { productId: "9000001", product: "Daily Glow Serum", variants: [
    { variantId: "90000011", title: "30ml", sku: "DGS-030" },
    { variantId: "90000012", title: "50ml", sku: "DGS-050" },
  ]},
  { productId: "9000002", product: "Restore Body Oil", variants: [
    { variantId: "90000021", title: "Citrus Grove", sku: "RBO-CIT" },
    { variantId: "90000022", title: "Warm Vanilla", sku: "RBO-VAN" },
    { variantId: "90000023", title: "Unscented", sku: "RBO-UNS" },
  ]},
  { productId: "9000003", product: "Calm Candle", variants: [
    { variantId: "90000031", title: "Lavender Fields", sku: "CC-LAV" },
    { variantId: "90000032", title: "Sandalwood", sku: "CC-SAN" },
    { variantId: "90000033", title: "Sea Salt", sku: "CC-SEA" },
  ]},
  { productId: "9000004", product: "Hydration Mist", variants: [
    { variantId: "90000041", title: "Rosewater", sku: "HM-ROS" },
  ]},
  { productId: "9000005", product: "Travel Pouch", variants: [
    { variantId: "90000051", title: "Standard", sku: "TP-STD" },
  ]},
];

function loadBundles() { try { return JSON.parse(localStorage.getItem(BUNDLES_KEY) || "null") || []; } catch { return []; } }
function saveBundles(b) { localStorage.setItem(BUNDLES_KEY, JSON.stringify(b)); }

// Stands in for calling Shopify's productVariants(query: "...") — a real
// implementation sends this same search string straight to the Admin API
// instead of filtering a local array.
function searchCatalog(q) {
  q = (q || "").trim().toLowerCase();
  if (!q) return [];
  return MOCK_CATALOG.filter(p =>
    p.product.toLowerCase().includes(q) ||
    p.variants.some(v => v.title.toLowerCase().includes(q) || v.sku.toLowerCase().includes(q))
  );
}

let bundles = null;
let bundleSearchOpenFor = null; // bundle id currently showing its "+ Add Product" search

function renderBundlesTab() {
  if (!bundles) bundles = loadBundles();
  document.getElementById("tab-body").innerHTML = `
    <p class="review-summary">Define what's actually in a campaign's gifting bundle — which products, and which of those a creator gets to choose a shade/size/scent for — so the form and the eventual order both know exactly what to send. Searching for a product below stands in for a real live search against the client's own Shopify catalog; nothing here is connected to a real store yet.</p>
    <div class="src-toolbar">
      <button class="btn btn-solid" type="button" id="bundle-new-btn" style="padding:10px 20px;font-size:11px">+ New Bundle</button>
    </div>
    <div id="bundle-list"></div>
  `;
  document.getElementById("bundle-new-btn").addEventListener("click", () => {
    const name = prompt("Bundle name (e.g. \"Fall 2026\")");
    if (!name || !name.trim()) return;
    bundles.push({ id: "b" + Date.now(), name: name.trim(), components: [] });
    saveBundles(bundles);
    renderBundleList();
  });
  renderBundleList();
}

function renderBundleList() {
  const wrap = document.getElementById("bundle-list");
  if (!bundles.length) {
    wrap.innerHTML = `<div class="empty-state">No bundles yet. Click "+ New Bundle" to define this month's gifting selection.</div>`;
    return;
  }
  wrap.innerHTML = bundles.map(b => `
    <div class="bundle-card" data-id="${escHtml(b.id)}">
      <div class="bundle-card-head">
        <span class="bundle-name">${escHtml(b.name)}</span>
        <span class="dim">${b.components.length} product${b.components.length === 1 ? "" : "s"}</span>
        <button class="btn-icon bundle-del-btn" type="button" data-id="${escHtml(b.id)}" title="Delete bundle" style="margin-left:auto">&times;</button>
      </div>
      <div class="bundle-components">
        ${b.components.map((comp, i) => renderBundleComponent(b, comp, i)).join("")}
      </div>
      ${bundleSearchOpenFor === b.id ? renderBundleSearch(b) : `
        <button class="btn btn-outline bundle-add-product-btn" type="button" data-id="${escHtml(b.id)}" style="padding:8px 16px;font-size:11px;margin-top:10px">+ Add Product</button>
      `}
    </div>
  `).join("");

  wrap.querySelectorAll(".bundle-del-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      bundles = bundles.filter(b => b.id !== btn.dataset.id);
      saveBundles(bundles);
      renderBundleList();
    });
  });
  wrap.querySelectorAll(".bundle-add-product-btn").forEach(btn => {
    btn.addEventListener("click", () => { bundleSearchOpenFor = btn.dataset.id; renderBundleList(); });
  });
  wrap.querySelectorAll(".bundle-search-input").forEach(inp => {
    inp.addEventListener("input", () => renderBundleSearchResults(inp.closest(".bundle-card").dataset.id, inp.value));
    inp.focus();
  });
  wrap.querySelectorAll(".bundle-search-cancel").forEach(btn => {
    btn.addEventListener("click", () => { bundleSearchOpenFor = null; renderBundleList(); });
  });
  wrap.querySelectorAll(".bundle-result-add").forEach(btn => {
    btn.addEventListener("click", () => {
      const bundleId = btn.dataset.bundleId;
      const productId = btn.dataset.productId;
      const b = bundles.find(x => x.id === bundleId);
      const product = MOCK_CATALOG.find(p => p.productId === productId);
      b.components.push({
        productId: product.productId,
        productName: product.product,
        mode: product.variants.length > 1 ? "choice" : "fixed",
        offeredVariantIds: product.variants.map(v => v.variantId), // all offered by default
        fixedVariantId: product.variants[0].variantId,
      });
      saveBundles(bundles);
      bundleSearchOpenFor = null;
      renderBundleList();
    });
  });
  wrap.querySelectorAll(".bundle-comp-mode").forEach(sel => {
    sel.addEventListener("change", () => {
      const b = bundles.find(x => x.id === sel.dataset.bundleId);
      const comp = b.components[+sel.dataset.i];
      comp.mode = sel.value;
      saveBundles(bundles);
      renderBundleList();
    });
  });
  wrap.querySelectorAll(".bundle-comp-variant-chk").forEach(chk => {
    chk.addEventListener("change", () => {
      const b = bundles.find(x => x.id === chk.dataset.bundleId);
      const comp = b.components[+chk.dataset.i];
      const vid = chk.dataset.variantId;
      if (chk.checked) { if (!comp.offeredVariantIds.includes(vid)) comp.offeredVariantIds.push(vid); }
      else { comp.offeredVariantIds = comp.offeredVariantIds.filter(id => id !== vid); }
      saveBundles(bundles);
    });
  });
  wrap.querySelectorAll(".bundle-comp-fixed-sel").forEach(sel => {
    sel.addEventListener("change", () => {
      const b = bundles.find(x => x.id === sel.dataset.bundleId);
      const comp = b.components[+sel.dataset.i];
      comp.fixedVariantId = sel.value;
      saveBundles(bundles);
    });
  });
  wrap.querySelectorAll(".bundle-comp-remove").forEach(btn => {
    btn.addEventListener("click", () => {
      const b = bundles.find(x => x.id === btn.dataset.bundleId);
      b.components.splice(+btn.dataset.i, 1);
      saveBundles(bundles);
      renderBundleList();
    });
  });
}

function renderBundleSearch(b) {
  return `
    <div class="bundle-search">
      <input type="search" class="bundle-search-input" placeholder="Search the client's Shopify catalog…">
      <div class="bundle-search-results" id="bundle-search-results"></div>
      <button class="btn btn-outline bundle-search-cancel" type="button" style="padding:7px 14px;font-size:11px;margin-top:8px">Cancel</button>
    </div>
  `;
}
function renderBundleSearchResults(bundleId, query) {
  const results = searchCatalog(query);
  document.getElementById("bundle-search-results").innerHTML = results.length ? results.map(p => `
    <div class="bundle-search-result">
      <span>${escHtml(p.product)}</span>
      <span class="dim">${p.variants.length} variant${p.variants.length === 1 ? "" : "s"}</span>
      <button class="btn-icon bundle-result-add" type="button" data-bundle-id="${escHtml(bundleId)}" data-product-id="${escHtml(p.productId)}" title="Add to bundle">+</button>
    </div>
  `).join("") : (query.trim() ? `<p class="dim" style="padding:8px 0">No matches in the catalog.</p>` : "");
  document.querySelectorAll(".bundle-result-add").forEach(btn => {
    btn.addEventListener("click", () => {
      const bundleIdX = btn.dataset.bundleId;
      const productIdX = btn.dataset.productId;
      const b = bundles.find(x => x.id === bundleIdX);
      const product = MOCK_CATALOG.find(p => p.productId === productIdX);
      b.components.push({
        productId: product.productId,
        productName: product.product,
        mode: product.variants.length > 1 ? "choice" : "fixed",
        offeredVariantIds: product.variants.map(v => v.variantId),
        fixedVariantId: product.variants[0].variantId,
      });
      saveBundles(bundles);
      bundleSearchOpenFor = null;
      renderBundleList();
    });
  });
}

function renderBundleComponent(b, comp, i) {
  const product = MOCK_CATALOG.find(p => p.productId === comp.productId);
  const variants = product ? product.variants : [];
  return `
    <div class="bundle-component">
      <div class="bundle-component-head">
        <span class="bundle-component-name">${escHtml(comp.productName)}</span>
        <select class="bundle-comp-mode" data-bundle-id="${escHtml(b.id)}" data-i="${i}" ${variants.length <= 1 ? "disabled" : ""}>
          <option value="fixed" ${comp.mode === "fixed" ? "selected" : ""}>Fixed — always the same</option>
          <option value="choice" ${comp.mode === "choice" ? "selected" : ""}>Creator chooses</option>
        </select>
        <button class="btn-icon bundle-comp-remove" type="button" data-bundle-id="${escHtml(b.id)}" data-i="${i}" title="Remove from bundle" style="margin-left:auto">&times;</button>
      </div>
      ${comp.mode === "fixed" ? `
        <div class="bundle-component-body">
          <label class="dim" style="font-size:11.5px">Variant sent to every creator:</label>
          <select class="bundle-comp-fixed-sel" data-bundle-id="${escHtml(b.id)}" data-i="${i}">
            ${variants.map(v => `<option value="${escHtml(v.variantId)}" ${comp.fixedVariantId === v.variantId ? "selected" : ""}>${escHtml(v.title)} (${escHtml(v.sku)})</option>`).join("")}
          </select>
        </div>
      ` : `
        <div class="bundle-component-body">
          <label class="dim" style="font-size:11.5px">Options offered to the creator on the gift form:</label>
          <div class="bundle-variant-options">
            ${variants.map(v => `
              <label class="bundle-variant-opt">
                <input type="checkbox" class="bundle-comp-variant-chk" data-bundle-id="${escHtml(b.id)}" data-i="${i}" data-variant-id="${escHtml(v.variantId)}" ${comp.offeredVariantIds.includes(v.variantId) ? "checked" : ""}>
                ${escHtml(v.title)} <span class="dim">(${escHtml(v.sku)})</span>
              </label>
            `).join("")}
          </div>
        </div>
      `}
    </div>
  `;
}

renderActiveTab();
</script>
</body>
</html>
