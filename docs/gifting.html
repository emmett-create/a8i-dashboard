<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gifting — A8I</title>
<link rel="icon" href="assets/icon-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero" style="padding-bottom:40px">
<div id="header"></div>
  <div class="hero-inner" style="padding-top:50px">
    <div class="eyebrow">A8I &middot; 03</div>
    <h1>Gifting</h1>
  </div>
</section>

<section class="section src-section" style="padding-top:60px">
  <div class="src-label">Gift Application</div>
  <p class="review-summary" id="ga-summary"></p>
  <div id="content"></div>
</section>

<div class="overlay hidden" id="ga-edit-overlay">
  <div class="modal-card">
    <h3>Edit gift application</h3>
    <p id="ga-edit-sub"></p>
    <div class="field"><label>Email</label><input type="text" id="ga-ef-email" placeholder="creator@email.com"></div>
    <div class="field"><label>Phone</label><input type="text" id="ga-ef-phone" placeholder="(555) 555-5555"></div>
    <div class="field"><label>Shipping address</label><input type="text" id="ga-ef-shipping" placeholder="123 Main St, City, ST 00000"></div>
    <div class="field"><label>Product</label><input type="text" id="ga-ef-product" placeholder="e.g. Hero bundle"></div>
    <div class="field"><label>Notes</label><textarea id="ga-ef-notes" placeholder="Anything worth flagging…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" type="button" id="ga-edit-cancel">Cancel</button>
      <button class="btn btn-solid" type="button" id="ga-edit-save">Save</button>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="common.js"></script>
<script>
document.getElementById("header").innerHTML = renderHeader({ onDark: true, back: "process.html" });
document.getElementById("footer").innerHTML = renderFooter();

const KNOWN_KEY = "a8i_known_creators";
const DECISIONS_KEY = "a8i_creator_decisions";
const GIFT_KEY = "a8i_gift_applications";

function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}"); } catch { return {}; } }
function loadDecisions() { try { return JSON.parse(localStorage.getItem(DECISIONS_KEY) || "{}"); } catch { return {}; } }
function loadGiftData() { try { return JSON.parse(localStorage.getItem(GIFT_KEY) || "{}"); } catch { return {}; } }
function saveGiftData(d) { localStorage.setItem(GIFT_KEY, JSON.stringify(d)); }

const STATUS_OPTIONS = ["Not placed", "Order placed", "Delivered"];
const ORDER_KEY = "a8i_order_placements";
function loadOrders() { try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "{}"); } catch { return {}; } }
function saveOrders(o) { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }

// First stage red, last stage green, everything between amber; a stage
// flagged as a negative/closed outcome is muted gray instead.
function stageColorClass(stages, value, negatives = []) {
  if (negatives.includes(value)) return "stage-muted";
  const idx = stages.indexOf(value);
  if (idx <= 0) return "stage-red";
  if (idx === stages.length - 1) return "stage-green";
  return "stage-amber";
}

function platLink(url, label, isDup) {
  if (!url) return `<span class="dim">—</span>`;
  const link = `<a class="plat-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(label)}</a>`;
  return isDup ? `<span class="handle-dup" title="Same handle appears more than once in this list">${link}</span>` : link;
}
function igCell(c, isDup) { return c.ig_handle ? platLink(c.ig_url, "@" + c.ig_handle, isDup) : `<span class="dim">—</span>`; }
function ttCell(c, isDup) { return c.tt_handle ? platLink(c.tt_url, "@" + c.tt_handle, isDup) : `<span class="dim">—</span>`; }
function cellOr(v) { return v ? escHtml(v) : `<span class="dim">—</span>`; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—"; }

const known = loadKnown();
const decisions = loadDecisions();
let giftData = loadGiftData();
const content = document.getElementById("content");

// Approved creators from Sourcing are the applicant pool — standing in for
// a real external intake form (what the paid system calls submissions),
// since a8i doesn't have one of its own yet. Each gets seeded with an empty
// editable application the first time it's seen here, backdated a few mock
// days so the list doesn't look like everything "applied" in the same instant.
// Product defaults to whatever was entered on Onboarding, if anything was.
let defaultProduct = "";
try {
  const saved = JSON.parse(localStorage.getItem("a8i_match_result") || "null");
  defaultProduct = saved?.criteria?.product || "";
} catch {}

const approvedCreators = Object.values(known).filter(c => decisions[c.id] === "yes");
let seeded = false;
approvedCreators.forEach((c, i) => {
  if (!giftData[c.id]) {
    giftData[c.id] = {
      email: "", phone: "", shipping: "", product: defaultProduct, notes: "",
      status: "Not placed",
      submittedAt: Date.now() - ((i % 6) + 1) * 86400000,
    };
    seeded = true;
  }
});
if (seeded) saveGiftData(giftData);

if (!approvedCreators.length) {
  document.getElementById("ga-summary").textContent = "";
  content.innerHTML = `
    <div class="empty-state">
      No gift applications yet.<br>
      <a href="sourcing.html">Approve some creators in Sourcing first &rarr;</a>
    </div>
  `;
} else {
  document.getElementById("ga-summary").textContent =
    `${approvedCreators.length.toLocaleString()} approved creator${approvedCreators.length === 1 ? "" : "s"} from Sourcing, standing in for real gift-application submissions.`;

  content.innerHTML = `
    <div class="src-toolbar">
      <input type="search" id="ga-search" placeholder="Search name or handle…">
      <select id="ga-filter-client"><option value="">All clients</option></select>
      <select id="ga-filter-status">
        <option value="">All statuses</option>
        ${STATUS_OPTIONS.map(s => `<option value="${escHtml(s)}">${escHtml(s)}</option>`).join("")}
      </select>
      <select id="ga-filter-product"><option value="">All products</option></select>
    </div>
    <p class="src-shown-count" id="shown-count"></p>
    <div class="src-table-wrap">
      <table class="src-table gift-table">
        <thead>
          <tr>
            <th class="no-sort"></th>
            <th class="sort" data-col="submittedAt">Date <span class="sort-icon"></span></th>
            <th class="sort" data-col="name">Name <span class="sort-icon"></span></th>
            <th class="no-sort">Instagram</th>
            <th class="no-sort">TikTok</th>
            <th class="sort" data-col="client">Client <span class="sort-icon"></span></th>
            <th class="no-sort">Email</th>
            <th class="no-sort">Phone</th>
            <th class="no-sort">Shipping Address</th>
            <th class="no-sort">Product</th>
            <th class="no-sort">Status</th>
            <th class="no-sort">Send to Place?</th>
          </tr>
        </thead>
        <tbody id="ga-tbody"></tbody>
      </table>
    </div>
  `;

  const clientSel = document.getElementById("ga-filter-client");
  [...new Set(approvedCreators.map(c => c.client).filter(Boolean))].sort().forEach(v => {
    clientSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });
  const productSel = document.getElementById("ga-filter-product");
  [...new Set(approvedCreators.map(c => (giftData[c.id] || {}).product).filter(Boolean))].sort().forEach(v => {
    productSel.insertAdjacentHTML("beforeend", `<option value="${escHtml(v)}">${escHtml(v)}</option>`);
  });

  let sortCol = "submittedAt", sortDir = "desc";

  function render() {
    const q = document.getElementById("ga-search").value.trim().toLowerCase();
    const clientFilter = document.getElementById("ga-filter-client").value;
    const statusFilter = document.getElementById("ga-filter-status").value;
    const productFilter = document.getElementById("ga-filter-product").value;

    let rows = approvedCreators.filter(c => {
      const g = giftData[c.id] || {};
      if (clientFilter && c.client !== clientFilter) return false;
      if (statusFilter && g.status !== statusFilter) return false;
      if (productFilter && g.product !== productFilter) return false;
      if (q && !`${c.name} ${c.ig_handle || ""} ${c.tt_handle || ""}`.toLowerCase().includes(q)) return false;
      return true;
    });

    rows.sort((a, b) => {
      const ga = giftData[a.id] || {}, gb = giftData[b.id] || {};
      let av = sortCol === "submittedAt" ? ga.submittedAt : a[sortCol];
      let bv = sortCol === "submittedAt" ? gb.submittedAt : b[sortCol];
      if (sortCol === "submittedAt") { av = av || 0; bv = bv || 0; }
      else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("shown-count").textContent = `Showing ${rows.length.toLocaleString()} of ${approvedCreators.length.toLocaleString()} applications`;

    const orders = loadOrders();

    // Gift app cleanup: flag a handle that appears more than once across
    // every approved application — not just the filtered view, since a dupe
    // elsewhere in the list is still worth knowing about.
    const igCounts = {}, ttCounts = {};
    approvedCreators.forEach(c => {
      const ig = (c.ig_handle || "").trim().toLowerCase();
      const tt = (c.tt_handle || "").trim().toLowerCase();
      if (ig) igCounts[ig] = (igCounts[ig] || 0) + 1;
      if (tt) ttCounts[tt] = (ttCounts[tt] || 0) + 1;
    });

    document.getElementById("ga-tbody").innerHTML = rows.length ? rows.map(c => {
      const g = giftData[c.id] || {};
      const alreadySent = !!orders[c.id];
      const igDup = c.ig_handle && igCounts[c.ig_handle.trim().toLowerCase()] > 1;
      const ttDup = c.tt_handle && ttCounts[c.tt_handle.trim().toLowerCase()] > 1;
      return `
        <tr data-id="${escHtml(c.id)}">
          <td><button class="btn-icon ga-edit-btn" type="button" title="Edit email, shipping, product, notes">&#9998;</button></td>
          <td class="dim">${fmtDate(g.submittedAt)}</td>
          <td class="name-cell">${escHtml(c.name)}</td>
          <td>${igCell(c, igDup)}</td>
          <td>${ttCell(c, ttDup)}</td>
          <td>${escHtml(c.client)}</td>
          <td>${cellOr(g.email)}</td>
          <td>${cellOr(g.phone)}</td>
          <td>${cellOr(g.shipping)}</td>
          <td>${cellOr(g.product)}</td>
          <td><select class="status-select ga-status-sel ${stageColorClass(STATUS_OPTIONS, g.status)}" data-id="${escHtml(c.id)}">${STATUS_OPTIONS.map(s => `<option value="${escHtml(s)}"${s === g.status ? " selected" : ""}>${escHtml(s)}</option>`).join("")}</select></td>
          <td><button class="btn-icon ga-send-order-btn" type="button" data-id="${escHtml(c.id)}" title="${alreadySent ? "Already sent — click to resend the latest details" : "Send to Order Placement"}">${alreadySent ? "&#10003;" : "&rarr;"}</button></td>
        </tr>
      `;
    }).join("") : `<tr><td colspan="12" class="dim" style="text-align:center;padding:30px">No applications match these filters.</td></tr>`;

    document.querySelectorAll(".src-table th.sort .sort-icon").forEach(el => el.textContent = "");
    const activeTh = document.querySelector(`.src-table th[data-col="${sortCol}"] .sort-icon`);
    if (activeTh) activeTh.textContent = sortDir === "asc" ? " ↑" : " ↓";

    document.querySelectorAll(".ga-edit-btn").forEach(btn => {
      btn.addEventListener("click", () => openEditModal(btn.closest("tr").dataset.id));
    });
    document.querySelectorAll(".ga-status-sel").forEach(sel => {
      sel.addEventListener("change", () => {
        giftData[sel.dataset.id] = { ...(giftData[sel.dataset.id] || {}), status: sel.value };
        saveGiftData(giftData);
        sel.className = `status-select ga-status-sel ${stageColorClass(STATUS_OPTIONS, sel.value)}`;
      });
    });
    document.querySelectorAll(".ga-send-order-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const c = known[id];
        const g = giftData[id] || {};
        const ord = loadOrders();
        ord[id] = {
          ...(ord[id] || {}),
          email: g.email, phone: g.phone, shipping: g.shipping, product: g.product, notes: g.notes,
          orderStatus: ord[id]?.orderStatus || "Pending",
          sentAt: Date.now(),
        };
        saveOrders(ord);
        render();
      });
    });
  }

  document.querySelectorAll(".src-table th.sort").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortCol = col; sortDir = col === "submittedAt" ? "desc" : "asc"; }
      render();
    });
  });
  ["ga-search", "ga-filter-client", "ga-filter-status", "ga-filter-product"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
  });

  render();

  // ── Edit modal ───────────────────────────────────────────────────────
  const overlay = document.getElementById("ga-edit-overlay");
  let editingId = null;
  function openEditModal(id) {
    const c = known[id];
    const g = giftData[id] || {};
    editingId = id;
    document.getElementById("ga-edit-sub").textContent = `${c.name} — @${c.ig_handle || c.tt_handle || "no handle"}`;
    document.getElementById("ga-ef-email").value = g.email || "";
    document.getElementById("ga-ef-phone").value = g.phone || "";
    document.getElementById("ga-ef-shipping").value = g.shipping || "";
    document.getElementById("ga-ef-product").value = g.product || "";
    document.getElementById("ga-ef-notes").value = g.notes || "";
    overlay.classList.remove("hidden");
  }
  document.getElementById("ga-edit-cancel").addEventListener("click", () => overlay.classList.add("hidden"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.add("hidden"); });
  document.getElementById("ga-edit-save").addEventListener("click", () => {
    giftData[editingId] = {
      ...(giftData[editingId] || {}),
      email: document.getElementById("ga-ef-email").value.trim(),
      phone: document.getElementById("ga-ef-phone").value.trim(),
      shipping: document.getElementById("ga-ef-shipping").value.trim(),
      product: document.getElementById("ga-ef-product").value.trim(),
      notes: document.getElementById("ga-ef-notes").value.trim(),
    };
    saveGiftData(giftData);
    overlay.classList.add("hidden");
    render();
  });
}
</script>
</body>
</html>
